version: '3.8'

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: portal
    depends_on:
      - yandexmaps
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - SEARCH_PROXY_URL=${SEARCH_PROXY_URL}
      - SEARCH_PROXY_URLS=${SEARCH_PROXY_URLS}
      - SEARCH_PLAYWRIGHT_ENABLED=${SEARCH_PLAYWRIGHT_ENABLED}
      - SEARCH_PLAYWRIGHT_HEADLESS=${SEARCH_PLAYWRIGHT_HEADLESS}
      - SEARCH_PLAYWRIGHT_TIMEOUT_MS=${SEARCH_PLAYWRIGHT_TIMEOUT_MS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
    restart: unless-stopped
    networks:
      - portal-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: portal-worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - SEARCH_PROXY_URL=${SEARCH_PROXY_URL}
      - SEARCH_PROXY_URLS=${SEARCH_PROXY_URLS}
      - SEARCH_PLAYWRIGHT_ENABLED=${SEARCH_PLAYWRIGHT_ENABLED}
      - SEARCH_PLAYWRIGHT_HEADLESS=${SEARCH_PLAYWRIGHT_HEADLESS}
      - SEARCH_PLAYWRIGHT_TIMEOUT_MS=${SEARCH_PLAYWRIGHT_TIMEOUT_MS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - WORKER_POLL_INTERVAL_MS=3000
    depends_on:
      - yandexmaps
    restart: unless-stopped
    networks:
      - portal-network

  yandexmaps:
    build:
      context: ./services/yandexmaps
      dockerfile: Dockerfile
    container_name: portal-yandexmaps
    ports:
      - "8010:8000"
    restart: unless-stopped
    networks:
      - portal-network

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portal-guacd
    restart: unless-stopped
    profiles:
      - rdp
    networks:
      - portal-network

  rdp-ws:
    build:
      context: ./services/rdp-ws
      dockerfile: Dockerfile
    container_name: portal-rdp-ws
    depends_on:
      - guacd
    profiles:
      - rdp
    ports:
      - "8082:8080"
    environment:
      - RDP_WS_SECRET=${RDP_WS_SECRET}
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    restart: unless-stopped
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
