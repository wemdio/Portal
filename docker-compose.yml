version: '3.8'

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: portal
    depends_on:
      - yandexmaps
      - telegram-bot-api
      - transcribe-worker
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TG_TRANSCRIBE_BOT_TOKEN=${TG_TRANSCRIBE_BOT_TOKEN}
      - TG_LOCAL_API_URL=http://telegram-bot-api:8081
      - HH_PROXY_URL=${HH_PROXY_URL}
      - SEARCH_PROXY_URL=${SEARCH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN}
      - SEARCH_PLAYWRIGHT_ENABLED=${SEARCH_PLAYWRIGHT_ENABLED}
      - SEARCH_PLAYWRIGHT_HEADLESS=${SEARCH_PLAYWRIGHT_HEADLESS}
      - SEARCH_PLAYWRIGHT_TIMEOUT_MS=${SEARCH_PLAYWRIGHT_TIMEOUT_MS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - TG_AGENT_BOT_TOKEN=${TG_AGENT_BOT_TOKEN}
      - OPENROUTER_AGENT_API_KEY=${OPENROUTER_AGENT_API_KEY}
      - INSTANTLY_API_KEY=${INSTANTLY_API_KEY}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-local}
      - TRANSCRIPTION_WORKER_URL=http://transcribe-worker:8070
      - TG_TARGET_API_ID=${TG_TARGET_API_ID}
      - TG_TARGET_API_HASH=${TG_TARGET_API_HASH}
      - TG_TARGET_SESSION=${TG_TARGET_SESSION}
    restart: unless-stopped
    networks:
      - portal-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: portal-worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - SEARCH_PROXY_URL=${SEARCH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN}
      - SEARCH_PLAYWRIGHT_ENABLED=${SEARCH_PLAYWRIGHT_ENABLED}
      - SEARCH_PLAYWRIGHT_HEADLESS=${SEARCH_PLAYWRIGHT_HEADLESS}
      - SEARCH_PLAYWRIGHT_TIMEOUT_MS=${SEARCH_PLAYWRIGHT_TIMEOUT_MS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - WORKER_POLL_INTERVAL_MS=3000
      - TG_TARGET_API_ID=${TG_TARGET_API_ID}
      - TG_TARGET_API_HASH=${TG_TARGET_API_HASH}
      - TG_TARGET_SESSION=${TG_TARGET_SESSION}
    depends_on:
      - yandexmaps
    restart: unless-stopped
    networks:
      - portal-network

  transcribe-worker:
    build:
      context: ./services/transcribe-worker
      dockerfile: Dockerfile
    container_name: portal-transcribe-worker
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-}
      - MAX_CONCURRENT=${TRANSCRIBE_MAX_CONCURRENT:-1}
    ports:
      - "8070:8070"
    restart: unless-stopped
    networks:
      - portal-network

  yandexmaps:
    build:
      context: ./services/yandexmaps
      dockerfile: Dockerfile
    container_name: portal-yandexmaps
    ports:
      - "8010:8000"
    restart: unless-stopped
    networks:
      - portal-network

  health-check:
    build:
      context: ./services/health-check
      dockerfile: Dockerfile
    container_name: portal-health-check
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
      - HEALTH_PORTAL_URL=${HEALTH_PORTAL_URL:-https://polza-portal.ru}
      - HEALTH_INTERVAL_SEC=${HEALTH_INTERVAL_SEC:-300}
      - HEALTH_SERVER_IP=${HEALTH_SERVER_IP:-139.60.162.12}
      - PROXY_URLS=${PROXY_URLS}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
    restart: unless-stopped
    networks:
      - portal-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: portal-telegram-bot-api
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - portal-network

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portal-guacd
    restart: unless-stopped
    profiles:
      - rdp
    networks:
      - portal-network

  rdp-ws:
    build:
      context: ./services/rdp-ws
      dockerfile: Dockerfile
    container_name: portal-rdp-ws
    depends_on:
      - guacd
    profiles:
      - rdp
    ports:
      - "8082:8080"
    environment:
      - RDP_WS_SECRET=${RDP_WS_SECRET}
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    restart: unless-stopped
    networks:
      - portal-network

volumes:
  telegram-bot-api-data:

networks:
  portal-network:
    driver: bridge

