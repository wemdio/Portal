name: Branch checks

# Быстрые проверки рабочих веток — двойник блока «Run tests» из
# .semaphore/semaphore.yml, запасной на случай простоя Semaphore. На test и
# main не запускается ничего: сборка образов и выкладка живут только в
# .semaphore/ (и в ручном сценарии с машины разработчика). Выкладки здесь
# больше нет — main-deploy.yml удалён 30.09.2026 как неработающий.
#
# Только push: репозиторий публичный, pull_request из форка сюда не добавлять.
on:
  push:
    branches-ignore:
      - main
      - test
    paths:
      - 'app/**'
      - '.github/**'
      - '.semaphore/semaphore.yml'
      - '.semaphore/select-deploy-targets.sh'
      - '.semaphore/test-select-deploy-targets.sh'
      - 'drain-worker.sh'
      - 'supabase/migrations/**'
      - 'Dockerfile'
      - 'Dockerfile.worker'
      - 'docker-compose.prod.yml'
      - 'services/health-check/**'

# Следующий пуш в ту же ветку отменяет ещё идущий прогон предыдущего.
concurrency:
  group: branch-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Неглубокий клон: общую точку с test дотягивает сам branch-tests.mjs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: ./.github/actions/app-checks
        with:
          tests: branch
