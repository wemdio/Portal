name: Branch checks

# Быстрые проверки рабочих веток — двойник блока «Run tests» из
# .semaphore/semaphore.yml. На test не запускается ничего, main обслуживает
# main-deploy.yml.
#
# Только push: репозиторий публичный, pull_request из форка сюда не добавлять.
on:
  push:
    branches-ignore:
      - main
      - test
    paths:
      - 'app/**'
      - '.github/**'
      - '.semaphore/semaphore.yml'
      - '.semaphore/select-deploy-targets.sh'
      - '.semaphore/test-select-deploy-targets.sh'
      - 'drain-worker.sh'
      - 'supabase/migrations/**'
      - 'Dockerfile'
      - 'Dockerfile.worker'
      - 'docker-compose.prod.yml'
      - 'services/health-check/**'

# Следующий пуш в ту же ветку отменяет ещё идущий прогон предыдущего.
concurrency:
  group: branch-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Неглубокий клон: общую точку с test дотягивает сам branch-tests.mjs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: ./.github/actions/app-checks
        with:
          tests: branch
