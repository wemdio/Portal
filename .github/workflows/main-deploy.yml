name: Main — checks, build, deploy

# Пуш в main: полная проверка → сборка изменившихся образов → выкладка.
#
# Сама выкладка не переписана: шаг deploy достаёт команду из
# .semaphore/scheduled-deploy.yml и выполняет её как есть. Источник правды по
# выкладке один — править её нужно там, а не здесь.
#
# Что собирать, решается не по одному пушу, а по всему диапазону
# last_deploy_sha..HEAD (тот же диапазон, по которому выкладка выбирает
# контейнеры): пропущенный или отменённый прогон не оставит образ несобранным.
#
# Только push и ручной запуск: репозиторий публичный, секреты не должны
# попадать в прогоны из форков — pull_request сюда не добавлять.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Выкладки идут по одной. Идущую не прерываем никогда (прод останется
# наполовину пересозданным); из ожидающих остаётся только последняя.
concurrency:
  group: main-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Full checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-checks
        with:
          tests: all

  plan:
    name: Plan image builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Вся история коммитов без содержимого файлов: для списка изменённых
      # путей хватает деревьев.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Select images changed since last deploy
        id: plan
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Секрет для ${name} не задан в GitHub"; exit 1; }
          done
          # Секреты GitHub заведены до переезда сервера: старые адреса — это не
          # прод, выкладка туда недопустима.
          case "$DEPLOY_HOST" in
            139.60.162.12|144.31.54.166)
              echo "::error::Секрет HOST указывает на старый сервер — обнови секреты GitHub перед выкладкой"
              exit 1
              ;;
          esac
          command -v sshpass >/dev/null || { sudo apt-get update && sudo apt-get install -y sshpass; }

          LAST=""
          ok=0
          for n in 1 2 3 4; do
            if LAST=$(sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" "cat /home/Portal/prod/last_deploy_sha 2>/dev/null || true"); then
              ok=1
              break
            fi
            echo "чтение last_deploy_sha: попытка ${n}/4 не удалась" >&2
            sleep 25
          done
          [ "$ok" = 1 ] || { echo "::error::Не удалось подключиться к серверу по SSH"; exit 1; }
          LAST=$(printf '%s' "$LAST" | tr -d '[:space:]')
          echo "Last deployed SHA: ${LAST:-<none>}"
          echo "Current SHA:       ${GITHUB_SHA}"

          # Образ → пути, изменение которых требует пересборки (как change_in
          # в .semaphore/semaphore.yml).
          images="portal worker yandexmaps googleparsers rdp-ws health-check loop-watchdog atmos-bot transcribe-worker instantly-sync-bot backup changelog-bot polza-reports external-sync"
          paths_for() {
            case "$1" in
              portal) echo "app/ Dockerfile entrypoint.sh supabase/migrations/ supabase/instantly-migrations/" ;;
              worker) echo "app/ Dockerfile.worker" ;;
              external-sync) echo "services/portal-external-sync/" ;;
              *) echo "services/$1/" ;;
            esac
          }

          selected=""
          if [ -z "$LAST" ] || ! git cat-file -e "${LAST}^{commit}" 2>/dev/null; then
            echo "Последний выложенный коммит неизвестен — собираем все образы."
            selected="$images"
          elif [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "Этот коммит уже выложен — собирать нечего."
          else
            changed=$(git diff --name-only "$LAST" "$GITHUB_SHA")
            for image in $images; do
              for prefix in $(paths_for "$image"); do
                if printf '%s\n' "$changed" | grep -q "^${prefix}"; then
                  selected="${selected}${selected:+ }${image}"
                  break
                fi
              done
            done
          fi
          echo "Images to build: ${selected:-<none>}"
          matrix=$(printf '%s\n' $selected | jq -R . | jq -cs 'map(select(length > 0))')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Упавшая сборка одного образа не обрывает остальные.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker login
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
          docker buildx create --use
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RDP_WS_URL: ${{ secrets.NEXT_PUBLIC_RDP_WS_URL }}
          NEXT_PUBLIC_SIGNUP_HOSTS: ${{ secrets.NEXT_PUBLIC_SIGNUP_HOSTS }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            portal)
              # Эти значения запекаются в образ: пустое сломает портал на проде.
              for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_RDP_WS_URL NEXT_PUBLIC_SIGNUP_HOSTS; do
                [ -n "${!name}" ] || { echo "::error::Секрет ${name} не задан в GitHub"; exit 1; }
              done
              docker buildx build --push \
                --tag "${DOCKER_USERNAME}/portal:prod" \
                --cache-from "type=registry,ref=${DOCKER_USERNAME}/portal:buildcache" \
                --cache-to "type=registry,ref=${DOCKER_USERNAME}/portal:buildcache,mode=max" \
                --build-arg "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
                --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
                --build-arg "NEXT_PUBLIC_RDP_WS_URL=${NEXT_PUBLIC_RDP_WS_URL}" \
                --build-arg "NEXT_PUBLIC_SIGNUP_HOSTS=${NEXT_PUBLIC_SIGNUP_HOSTS}" \
                --platform linux/amd64 -f Dockerfile .
              ;;
            worker)
              docker buildx build --push \
                --tag "${DOCKER_USERNAME}/portal-worker:prod" \
                --cache-from "type=registry,ref=${DOCKER_USERNAME}/portal-worker:buildcache" \
                --cache-to "type=registry,ref=${DOCKER_USERNAME}/portal-worker:buildcache,mode=max" \
                --platform linux/amd64 -f Dockerfile.worker .
              ;;
            external-sync)
              docker buildx build --push \
                --tag "${DOCKER_USERNAME}/portal-external-sync:prod" \
                --platform linux/amd64 -f services/portal-external-sync/Dockerfile services/portal-external-sync
              ;;
            *)
              docker buildx build --push \
                --tag "${DOCKER_USERNAME}/portal-${IMAGE}:prod" \
                --platform linux/amd64 -f "services/${IMAGE}/Dockerfile" "services/${IMAGE}"
              ;;
          esac

  deploy:
    name: Deploy to production
    needs: [checks, plan, build]
    # build может быть пропущен (собирать нечего) — это не повод не выкладывать.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Run the Semaphore deploy script
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          INSTANTLY_DB_SSH_HOST: ${{ secrets.INSTANTLY_DB_SSH_HOST }}
          INSTANTLY_DB_SSH_USER: ${{ secrets.INSTANTLY_DB_SSH_USER }}
          INSTANTLY_DB_SSH_PASSWORD: ${{ secrets.INSTANTLY_DB_SSH_PASSWORD }}
          INSTANTLY_DB_REMOTE_DIR: ${{ secrets.INSTANTLY_DB_REMOTE_DIR }}
          SENDER_SSH_HOST: ${{ secrets.SENDER_SSH_HOST }}
          SENDER_SSH_USER: ${{ secrets.SENDER_SSH_USER }}
          SENDER_SSH_PASSWORD: ${{ secrets.SENDER_SSH_PASSWORD }}
          SENDER_REMOTE_DIR: ${{ secrets.SENDER_REMOTE_DIR }}
          SENDER_SSH_HOST_2: ${{ secrets.SENDER_SSH_HOST_2 }}
          SENDER_SSH_USER_2: ${{ secrets.SENDER_SSH_USER_2 }}
          SENDER_SSH_PASSWORD_2: ${{ secrets.SENDER_SSH_PASSWORD_2 }}
          SENDER_REMOTE_DIR_2: ${{ secrets.SENDER_REMOTE_DIR_2 }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update && sudo apt-get install -y sshpass; }
          yq -r '.blocks[0].task.jobs[0].commands[0]' .semaphore/scheduled-deploy.yml > "$RUNNER_TEMP/deploy.sh"
          # Пустой файл = в Semaphore-конфиге поменялась структура; выкладывать вслепую нельзя.
          grep -q 'last_deploy_sha' "$RUNNER_TEMP/deploy.sh" || { echo "::error::Не удалось достать скрипт выкладки из .semaphore/scheduled-deploy.yml"; exit 1; }
          bash -n "$RUNNER_TEMP/deploy.sh"
          set +u
          bash "$RUNNER_TEMP/deploy.sh"
