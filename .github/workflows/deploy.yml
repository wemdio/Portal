name: Auto (push)

on:
  push:
    branches-ignore:
      - test

      
jobs:
  test:
    name: Run tests
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: self-hosted
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Run linter
        working-directory: ./app
        run: npm run lint

      - name: Run tests
        working-directory: ./app
        run: npm test -- --coverage --watchAll=false
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        with:
          token: ${{ env.CODECOV_TOKEN }}
          file: ./app/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  push_docker_hub_prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Push Docker image
    runs-on: self-hosted
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push portal image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portal:prod
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Push worker image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portal-worker:prod

      - name: Push instantly-sync-bot image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./services/instantly-sync-bot
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portal-instantly-sync-bot:prod

      - name: Push backup image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./services/backup
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portal-backup:prod

      - name: Push health-check image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./services/health-check
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portal-health-check:prod

  deploy_to_prod_dir:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    needs: push_docker_hub_prod
    steps:
      - name: executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd /home/Portal/prod/
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
            sudo docker compose version
            sudo docker compose -p portal -f docker-compose.prod.yml pull portal worker-baseconstructor worker-li-outreach instantly-sync-bot portal-backup health-check
            sudo docker ps -a --filter "label=com.docker.compose.service=portal" -q | xargs -r sudo docker rm -f
            sudo docker compose -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate portal
            sudo docker compose -p portal -f docker-compose.prod.yml up -d --no-deps instantly-sync-bot portal-backup
            sudo docker compose -p portal -f docker-compose.prod.yml up -d --no-deps worker-baseconstructor
            # worker-li-outreach needs to be in the redeploy loop the same way
            # worker-baseconstructor is: its image is built and pushed above,
            # but without this line the running container stays on the old
            # image (see fix history in 2026-05 where the welcome-handler /
            # startChat fixes shipped in code but the worker kept running the
            # bug until someone restarted it manually).
            sudo docker compose -p portal -f docker-compose.prod.yml up -d --no-deps worker-li-outreach
            # health-check has its OWN image (portal-health-check:prod, built
            # above). Recreate it so changes to services/health-check/main.py
            # (e.g. the daily LinkedIn-outreach digest) actually ship instead of
            # the container staying on the old image.
            sudo docker compose -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate health-check
            sudo docker image prune --force
            sudo docker volume prune --force
