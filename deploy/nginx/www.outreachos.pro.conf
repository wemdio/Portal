# www.outreachos.pro → https://outreachos.pro одним 301, путь и query (UTM) сохраняются.
#
# Сам outreachos.pro (русский лендинг) живёт не здесь, а на 92.246.76.92 (Caddy, репозиторий
# wemdio/outreachos-landing). На этот сервер (139.60.162.24) в DNS указывает только www.
# До 2026-10-21 здесь был включён старый vhost outreachos.pro (outreachos.pro + www, прокси
# в портал) с сертификатом, просроченным 2026-08-06. В итоге www показывал ошибку
# сертификата, а за ней открывался портал, а не лендинг. Продление того сертификата падало
# каждые 12 часов: проверка для outreachos.pro уходила на Caddy. Старый vhost выключен, файл
# остался в sites-available. Сертификат удалён, бэкап лежит в
# /root/outreachos.pro-cert-backup-20261021.tgz.
#
# Сертификат у www свой (cert-name www.outreachos.pro), HTTP-проверку отдаёт блок :80 ниже:
#   certbot certonly --webroot -w /var/www/html --cert-name www.outreachos.pro \
#     -d www.outreachos.pro --key-type ecdsa --deploy-hook "systemctl reload nginx"
# --deploy-hook обязателен: certonly переписывает настройки продления только из своей
# командной строки, и без флага перезагрузка nginx после продления пропадёт.
#
# Если www.outreachos.pro переводят в DNS на сервер лендинга, порядок такой. Сначала
# убедиться, что Caddy там обслуживает www. Потом сменить A-запись в Reg.ru и подождать её
# TTL. Только после этого выключить этот файл и выполнить
# certbot delete --cert-name www.outreachos.pro.
#
# На сервере: /etc/nginx/sites-available/www.outreachos.pro, symlink в sites-enabled.
# map $connection_upgrade, который раньше объявлял и старый vhost, объявлен в polza-portal.ru.

server {
    listen 80;
    server_name www.outreachos.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://outreachos.pro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.outreachos.pro;

    ssl_certificate     /etc/letsencrypt/live/www.outreachos.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.outreachos.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;

    return 301 https://outreachos.pro$request_uri;
}
