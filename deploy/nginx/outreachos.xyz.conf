# Английский лендинг outreachos.xyz (статический сайт; кабинет — app.outreachos.xyz).
# Файлы сайта — deploy/static/outreachos.xyz/ → на сервере /var/www/outreachos-xyz/.
# Форма заявки шлёт POST https://app.outreachos.xyz/api/demo-lead (no-cors), поэтому
# здесь проксировать ничего не нужно.
#
# Сегодня у апекса есть DNS на сервер, но нет vhost: HTTP отдаёт стоковую страницу
# nginx, HTTPS падает в чужой блок (app.outreachos.pro, ошибка сертификата).
#
# Порядок ввода (только с «да» владельца — это публикация и правка боевого nginx):
#   1) Скопировать сайт: rsync -a deploy/static/outreachos.xyz/ root@<сервер>:/var/www/outreachos-xyz/
#   2) Положить ЭТОТ файл в /etc/nginx/sites-available/ в HTTP-only виде (только первый
#      server-блок, listen 80) → symlink в sites-enabled → nginx -t && systemctl reload nginx.
#   3) certbot certonly --webroot -w /var/www/html -d outreachos.xyz
#   4) Положить полный файл (с 443-блоком), nginx -t && systemctl reload nginx.
#   5) Проверить: curl -I https://outreachos.xyz (200, свой сертификат), отправить тестовую
#      заявку с формы — строка в demo_leads (source eng_pilot) и сообщение в Telegram.
# www.outreachos.xyz DNS-записи не имеет — блок для него не нужен, пока её не заведут.

server {
    listen 80;
    server_name outreachos.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name outreachos.xyz;

    ssl_certificate     /etc/letsencrypt/live/outreachos.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outreachos.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/outreachos-xyz;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|svg|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
}
