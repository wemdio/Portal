# Лендинг outreachos.xyz, английская и русская версии (статический сайт; кабинет —
# app.outreachos.xyz). Файлы сайта — deploy/static/outreachos.xyz/ → на сервере
# /var/www/outreachos-xyz/ (en/index.html, ru/index.html, images/). Корневая
# /var/www/outreachos-xyz/index.html — прежняя одноязычная страница, её не перезаписывать
# (запасной вариант на случай отката, см. шаг 2 ниже).
# Форма заявки шлёт POST https://app.outreachos.xyz/api/demo-lead (no-cors), поэтому
# здесь проксировать ничего не нужно.
#
# Сейчас на сервере (опубликовано руками 2026-10-12): этот vhost лежит в
# /etc/nginx/sites-available/outreachos.xyz, symlink в sites-enabled, сертификат
# Let's Encrypt (certbot webroot /var/www/html, renew_hook reload nginx). Живая страница —
# старая одноязычная /index.html без UTM. В деплой-пайплайн сайт не входит.
#
# Адреса:
#   https://outreachos.xyz/en/   — английская версия (давать в ссылках)
#   https://outreachos.xyz/ru/   — русская версия (давать в ссылках)
#   /en, /ru                     — 301 на /en/, /ru/ с тем же query
#   /EN, /Ru/, /RU и т. п.       — 301 на /en/, /ru/ с тем же query (ссылку могли набрать
#                                  или продиктовать в другом регистре; файлы на сервере
#                                  ищутся с учётом регистра, без этого был бы 404)
#   /, /index.html               — 302 (никогда не 301) на /ru/ или /en/ с тем же query;
#                                  #якорь из старых ссылок браузер переносит сам
#                                  (/#pilot → /en/#pilot), на сервер он не приходит.
# Выбор языка для / и /index.html — три map ниже, по порядку:
#   1) ?lang=ru|en в ссылке (явный выбор того, кто дал ссылку);
#   2) cookie oos_lang=ru|en (ставит переключатель языка на странице, Domain=outreachos.xyz,
#      1 год, SameSite=Lax);
#   3) первый (главный) тег Accept-Language: ru, uk, be, kk → ru; всё остальное и
#      отсутствие заголовка → en. q-веса не сравниваем: браузеры пишут языки по убыванию.
# Ответ на / несёт Vary: Accept-Language, Cookie и Cache-Control: no-store, чтобы
# ни браузер, ни прокси не запомнили редирект одного посетителя для другого.
#
# map живут на уровне http, НЕ внутри server: файлы sites-enabled/* подключаются
# в /etc/nginx/nginx.conf внутри блока http { }, поэтому map в начале этого файла
# (до server-блоков) — уже http-уровень. Если файл когда-нибудь будут подключать иначе,
# map переносят в /etc/nginx/conf.d/outreachos-xyz-lang.conf (тоже внутри http), а не в server.
# Имена переменных уникальные (префикс outreachos_xyz_): map глобальны для всех vhost'ов.
# Копию этого файла в sites-enabled держать нельзя (бэкапы — только в sites-available):
# второй map с тем же именем либо уронит nginx -t, либо молча перекроет первый.
# Заголовки безопасности:
#   - X-Content-Type-Options стоит на уровне server и повторён в каждом location со своими
#     add_header (свой add_header в location отменяет наследование серверных).
#   - Referrer-Policy ставится только там, где отдаётся содержимое (/en/, /ru/, картинки,
#     прочие файлы), и намеренно НЕ ставится на редиректах (/, /index.html, /en, /ru, /RU…).
#     По спецификации Referrer Policy заголовок на ответе-редиректе заменяет политику запроса
#     для следующего шага. Тогда полный referrer внешней страницы (сайты с unsafe-url или
#     no-referrer-when-downgrade, редиректоры рассылок) обрезался бы до домена, и в заявке
#     «Пришёл с» и referrer в cookie oos_utm потеряли бы путь. У редиректа нет тела, так что
#     защищать там нечего.
#
# Порядок публикации RU/EN (только с «да» владельца — это публикация и правка боевого nginx):
#   1) Бэкапы (вне sites-enabled):
#        cp -a /etc/nginx/sites-available/outreachos.xyz{,.bak-$(date +%Y%m%d)}
#        cp -a /var/www/outreachos-xyz /var/www/outreachos-xyz.bak-$(date +%Y%m%d)
#   2) СНАЧАЛА файлы: en/, ru/ и images/. БЕЗ --delete и БЕЗ корневой index.html. Новый nginx
#      шлёт / на /en/ и /ru/, поэтому они должны уже лежать. А прежняя одноязычная
#      /index.html должна остаться на месте: до перезагрузки nginx / отдаёт именно её,
#      и при откате (шаг 5) она же снова станет главной страницей без лишних действий:
#        rsync -a --exclude=/index.html deploy/static/outreachos.xyz/ root@<сервер>:/var/www/outreachos-xyz/
#      («/» в начале шаблона — только корневая index.html; en/index.html и ru/index.html едут.)
#      Корневую index.html из репозитория (запасной вход на JS) на сервер НЕ класть. Новый
#      vhost её не отдаёт (/ и /index.html → 302), а при старом vhost или откате она
#      заменила бы рабочую страницу заглушкой. Ботам без JS (первый проход Googlebot, превью
#      Telegram, WhatsApp, LinkedIn; Telegram кэширует превью) она показывает голую страницу
#      без og-тегов. Живых посетителей она уводит через location.replace, и тогда внешний
#      referrer заменяется на https://outreachos.xyz/: «Пришёл с» в заявке пустой.
#   3) ПОТОМ этот файл → /etc/nginx/sites-available/outreachos.xyz (symlink уже есть),
#        nginx -t && systemctl reload nginx
#      Если nginx -t упал — reload не выполняется, старый vhost продолжает отдавать прежнюю
#      страницу; файлы шага 2 ей не мешают.
#   4) Проверить (ожидаемое — справа):
#        curl -sI https://outreachos.xyz/ -H 'Accept-Language: ru-RU,ru;q=0.9'  → 302 /ru/, Vary, no-store,
#                                                                              без Referrer-Policy
#        curl -sI https://outreachos.xyz/ -H 'Accept-Language: en-US,en;q=0.9'  → 302 /en/
#        curl -sI https://outreachos.xyz/                                      → 302 /en/
#        curl -sI https://outreachos.xyz/ -H 'Cookie: oos_lang=ru' -H 'Accept-Language: en' → 302 /ru/
#        curl -sI 'https://outreachos.xyz/?lang=ru&utm_source=test'            → 302 /ru/?lang=ru&utm_source=test
#        curl -sI https://outreachos.xyz/index.html -H 'Accept-Language: ru'   → 302 /ru/
#        curl -sI 'https://outreachos.xyz/ru?utm_source=test'                  → 301 /ru/?utm_source=test
#        curl -sI 'https://outreachos.xyz/RU/?utm_source=test'                 → 301 /ru/?utm_source=test
#        curl -sI https://outreachos.xyz/En                                     → 301 /en/
#        curl -sI https://outreachos.xyz/en/ ; curl -sI https://outreachos.xyz/ru/  → 200, Referrer-Policy
#        curl -sI https://outreachos.xyz/images/cases/itexus.svg               → 200
#      и тестовая заявка с /en/ и с /ru/ — строка в demo_leads и сообщение в Telegram
#      (строка «Язык страницы» в Telegram и utm.lang в базе появятся только после выкатки
#      правки портала Sergey→main; до неё заявка проходит как раньше, без языка).
#   5) Откат: cp -a /etc/nginx/sites-available/outreachos.xyz.bak-YYYYMMDD \
#        /etc/nginx/sites-available/outreachos.xyz && nginx -t && systemctl reload nginx
#      / снова отдаёт прежнюю одноязычную /index.html: шаг 2 её не трогал. en/ и ru/ можно
#      не удалять. Только если корневую index.html всё-таки перезаписали, вернуть её из бэкапа:
#        cp -a /var/www/outreachos-xyz.bak-YYYYMMDD/index.html /var/www/outreachos-xyz/index.html
#
# www.outreachos.xyz (A-запись на этот же сервер с 2026-10-21) — два блока в конце файла:
# с http и с https сразу 301 на https://outreachos.xyz$request_uri, путь и query (UTM)
# сохраняются, лишнего шага через https://www нет. Своих страниц у www нет: канонический
# адрес один, тот же, что в sitemap.xml и rel=canonical.
# У www СВОЙ сертификат (cert-name www.outreachos.xyz), сертификат outreachos.xyz его не
# включает намеренно: если www когда-нибудь сломается (DNS, блок на 80-м порту), не сможет
# продлиться только он, а основной домен продлится как раньше. Выпуск/перевыпуск:
#   certbot certonly --webroot -w /var/www/html --cert-name www.outreachos.xyz \
#     -d www.outreachos.xyz --key-type ecdsa --deploy-hook "systemctl reload nginx"
# --deploy-hook обязателен: certonly переписывает настройки продления только из своей
# командной строки, и без флага перезагрузка nginx после продления пропадёт. Так же и для
# outreachos.xyz, если его когда-нибудь перевыпускают через certonly.
# HTTP-проверку для www отдаёт его блок на 80-м порту (тот же webroot /var/www/html).
# Новый выпуск — в таком порядке: блок :80 для www → A-запись → certbot → блок :443.
# Блок :443 ссылается на файлы сертификата www, и без них nginx -t не пройдёт. Без блока
# :80 имя www на этом IP поймал бы sites-enabled/default (стандартная страница nginx), а на
# 443-м, где default_server нет, первый vhost app.outreachos.pro с чужим сертификатом.
# Отказ от www: сначала удалить A-запись и дождаться её TTL, потом убрать оба блока и
# certbot delete --cert-name www.outreachos.xyz. Сертификат outreachos.xyz не трогать.

# 3) Главный тег Accept-Language. Только первый тег, без учёта q.
map $http_accept_language $outreachos_xyz_lang_header {
    default                          en;
    "~*^\s*(?:ru|uk|be|kk)(?:[^a-z]|$)" ru;
}

# 2) Cookie переключателя; неизвестное значение → язык браузера.
map $cookie_oos_lang $outreachos_xyz_lang_saved {
    default                          $outreachos_xyz_lang_header;
    "~*^ru$"                         ru;
    "~*^en$"                         en;
}

# 1) ?lang= в ссылке; неизвестное значение → cookie, затем язык браузера.
map $arg_lang $outreachos_xyz_lang {
    default                          $outreachos_xyz_lang_saved;
    "~*^ru$"                         ru;
    "~*^en$"                         en;
}

server {
    listen 80;
    server_name outreachos.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name outreachos.xyz;

    ssl_certificate     /etc/letsencrypt/live/outreachos.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outreachos.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/outreachos-xyz;
    index index.html;

    # Referrer-Policy здесь нет намеренно: его ставят только location с содержимым (см. шапку).
    # Редиректы без своих add_header (/en, /ru, /RU…) наследуют отсюда только nosniff.
    add_header X-Content-Type-Options nosniff always;

    # Корень: выбор языка, 302 с сохранением query. Не кэшировать. Без Referrer-Policy.
    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 302 /$outreachos_xyz_lang/$is_args$args;
    }

    # Старые ссылки на /index.html — так же, как корень.
    location = /index.html {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 302 /$outreachos_xyz_lang/$is_args$args;
    }

    # Без слэша — навсегда на канонический адрес со слэшем.
    location = /en {
        return 301 /en/$is_args$args;
    }

    location = /ru {
        return 301 /ru/$is_args$args;
    }

    # Другой регистр (/EN, /Ru/, /RU …) — на канонический адрес. Зациклиться не может:
    # /en/ и /ru/ ловят ^~-локации ниже (они отключают проверку regex), а /en и /ru —
    # точные локации выше; сюда попадает только написание не строчными буквами.
    location ~* ^/en/?$ {
        return 301 /en/$is_args$args;
    }

    location ~* ^/ru/?$ {
        return 301 /ru/$is_args$args;
    }

    # Языковые страницы: /en/ → /en/index.html, /ru/ → /ru/index.html.
    # no-cache = браузер переспрашивает (304), поэтому ручная перепубликация видна сразу.
    location ^~ /en/ {
        add_header Content-Language en always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    location ^~ /ru/ {
        add_header Content-Language ru always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    # Картинки общие для обоих языков, по абсолютному пути /images/...
    location ~* \.(png|svg|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# www.outreachos.xyz → https://outreachos.xyz одним 301 (см. шапку). ACME-проверка для www
# на 80-м порту нужна, чтобы certbot продлевал отдельный сертификат www.
server {
    listen 80;
    server_name www.outreachos.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://outreachos.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.outreachos.xyz;

    ssl_certificate     /etc/letsencrypt/live/www.outreachos.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.outreachos.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Редирект: Referrer-Policy не ставим (см. шапку), только nosniff, как на других редиректах.
    add_header X-Content-Type-Options nosniff always;

    return 301 https://outreachos.xyz$request_uri;
}
