# ENG client cabinet host (outreachos.xyz). Модель — живой polza-portal.ru
# vhost (текущие proxy-цели 139.60.162.12:35480 / 127.0.0.1:3000).
# ВАЖНО: map $http_upgrade НЕ дублируем — он объявлен один раз в
# polza-portal.ru conf; повторное объявление уронит nginx -t.
#
# Порядок ввода (после DNS A-записи app.outreachos.xyz -> 139.60.162.12):
#   1) Сначала положить ЭТОТ файл в /etc/nginx/sites-available/ в HTTP-only
#      виде (только первый server-блок, listen 80) → symlink в sites-enabled →
#      nginx -t && systemctl reload nginx.
#   2) certbot certonly --webroot -w /var/www/html -d app.outreachos.xyz
#   3) Положить полный файл (с 443-блоком), nginx -t && reload.

server {
    listen 80;
    server_name app.outreachos.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.outreachos.xyz;

    ssl_certificate     /etc/letsencrypt/live/app.outreachos.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.outreachos.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 600m;

    # Те же буферы, что в polza-portal.ru.conf — иначе ответы Kong/PostgREST
    # с крупными заголовками дают 502 "upstream sent too big header".
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    large_client_header_buffers 4 32k;

    # Supabase API (тот же хост, Kong)
    location ^~ /auth/v1/ {
        proxy_pass http://139.60.162.12:35480;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location ^~ /rest/v1/ {
        proxy_pass http://139.60.162.12:35480;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location ^~ /storage/v1/ {
        proxy_pass http://139.60.162.12:35480;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location ^~ /realtime/v1/ {
        proxy_set_header Cookie "";
        proxy_pass http://139.60.162.12:35480;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Main portal app (middleware по хосту ведёт в /client/eng)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}
