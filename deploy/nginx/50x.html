<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Auto-poll the root: as soon as nginx can proxy to Next.js again, the
         next refresh stops hitting this fallback and the real app loads.
         No user click required. 15 s is short enough to feel snappy and
         long enough to not hammer the backend during the rebuild window. -->
    <meta http-equiv="refresh" content="15" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Обновление портала</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fafafa;
        background:
          radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255, 255, 255, 0.10), transparent 70%),
          #0a0a0a;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(460px, 100%);
        padding: 48px 36px;
        background: #111213;
        border: 1px solid #1f2023;
        border-radius: 20px;
        text-align: center;
        box-shadow:
          0 0 80px rgba(255, 255, 255, 0.06),
          0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        background: #18191c;
        border: 1px solid #1f2023;
        border-radius: 16px;
        font-size: 28px;
        line-height: 1;
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        margin-bottom: 18px;
        border-radius: 999px;
        background: #18191c;
        border: 1px solid #1f2023;
        color: #a1a1a3;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 600;
        color: #fafafa;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #a1a1a3;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">⚙</div>
      <span class="badge">Technical update</span>
      <h1>Обновление портала</h1>
      <p>Подождите, пожалуйста, 5–10 минут.</p>
    </main>
  </body>
</html>
