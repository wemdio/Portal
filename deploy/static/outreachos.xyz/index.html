<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="alternate" hreflang="en" href="https://outreachos.xyz/en/">
  <link rel="alternate" hreflang="ru" href="https://outreachos.xyz/ru/">
  <link rel="alternate" hreflang="x-default" href="https://outreachos.xyz/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OutreachOS">
  <meta property="og:title" content="OutreachOS — Find your next B2B growth channel">
  <meta property="og:description" content="Find the right B2B audience, test your positioning, and launch thoughtful outbound with OutreachOS and Polza Agency.">
  <meta property="og:image" content="https://outreachos.xyz/images/og-en.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OutreachOS by Polza Agency: get a lead engine built for your niche.">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Запасной вход на outreachos.xyz/. Обычно сюда не попадают: nginx отвечает на «/» 302 на
    // /ru/ или /en/. Эта страница нужна, если сайт открыт без того nginx-правила (локально,
    // старый vhost) — тогда язык выбирает этот скрипт по тому же правилу:
    //   1) ?lang=ru|en в адресе (ссылка, которой поделились; имя параметра без учёта регистра,
    //      как читает nginx);
    //   2) cookie oos_lang (её ставит переключатель языка на странице, год на outreachos.xyz);
    //   3) первый язык браузера: ru, uk, be, kk → русская версия, всё остальное → английская.
    // Query и якорь (#pilot, #cases …) уходят дальше без изменений: по ним работают метки
    // utm_* и старые ссылки на разделы. Без JS видны две обычные ссылки ниже.
    //
    // Переход скриптом (location.replace) браузер подписывает referrer'ом саму эту страницу,
    // и внешний источник (Google, LinkedIn…) до заявки бы не дошёл (при 302 от nginx браузер
    // сохраняет исходный referrer сам). Поэтому внешний referrer оставляется во вкладке
    // (sessionStorage oos_root_referrer) вместе с адресом этой страницы: /en/ и /ru/ берут его,
    // только если пришли именно отсюда.
    (function () {
      try {
        var KEY = 'oos_root_referrer';
        var referrer = document.referrer || '';
        if (referrer && new URL(referrer).hostname !== location.hostname) {
          sessionStorage.setItem(KEY, JSON.stringify({ referrer: referrer, from: location.href.split('#')[0] }));
        } else {
          sessionStorage.removeItem(KEY);
        }
      } catch (e) { /* storage blocked or odd referrer — the redirect below still works */ }
      try {
        var asked = null;  // первый параметр lang, как $arg_lang в nginx
        new URLSearchParams(location.search).forEach(function (value, name) {
          if (asked === null && name.toLowerCase() === 'lang') asked = value.toLowerCase();
        });
        var lang = asked === 'ru' || asked === 'en' ? asked : '';
        if (!lang) {
          var saved = document.cookie.match(/(?:^|;\s*)oos_lang=(ru|en)(?:;|$)/);
          if (saved) lang = saved[1];
        }
        if (!lang) {
          var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          lang = /^(ru|uk|be|kk)$/i.test(String(first).split(/[-_]/)[0]) ? 'ru' : 'en';
        }
        location.replace('/' + lang + '/' + location.search + location.hash);
      } catch (e) { /* остаются ссылки на странице */ }
    })();
  </script>
