# Воркер инструмента «Рассылка» — изолированный email-хост (144.31.54.166).
#
# Почему отдельный сервер: массовые SMTP/IMAP-подключения к провайдерам ящиков
# не должны идти с IP основного портала (139.60.162.24), иначе хостер банит
# весь интернет сервера. Этот compose живёт ТОЛЬКО на sender-хосте и никогда
# не добавляется в docker-compose.prod.yml стека портала.
#
# Воркер общается с порталом исключительно через БД (Supabase): проверка
# ящиков, планировщик цепочки, отправка, чтение ответов. Очередь берётся
# атомарно, поэтому позже контейнер можно размножить на несколько серверов.
#
# Деплой: Semaphore scheduled-deploy (цель SENDER_SSH_HOST), каталог
# /opt/portal-sender, .env — по deploy/sender/.env.example.
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose -p portal-sender --env-file .env up -d

services:
  worker-sender:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-sender
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - BYO_MAILBOX_CRED_KEY=${BYO_MAILBOX_CRED_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - SENDER_REPLIES_INTERVAL_MS=${SENDER_REPLIES_INTERVAL_MS:-60000}
      # Ящики Google Workspace без паролей: воркер берёт у Google часовой ключ
      # на конкретный ящик перед входом по SMTP/IMAP. Пусто — такие ящики просто
      # не пройдут проверку, остальные работают как раньше.
      - SENDER_GOOGLE_SA_EMAIL=${SENDER_GOOGLE_SA_EMAIL:-}
      - SENDER_GOOGLE_SA_PRIVATE_KEY=${SENDER_GOOGLE_SA_PRIVATE_KEY:-}
      # Каталог Workspace зеркалится раз в час: новые ящики домена появляются
      # на экране сами, выключенными.
      - SENDER_GOOGLE_SYNC_INTERVAL_MS=${SENDER_GOOGLE_SYNC_INTERVAL_MS:-3600000}
      # Контрольный ящик для «Проверить отправку»: туда шлём пробу и оттуда
      # же читаем заголовки доставленного письма. Обязательно внешний адрес —
      # между ящиками одного аккаунта провайдеры почту теряют.
      - SENDER_PROBE_TO_EMAIL=${SENDER_PROBE_TO_EMAIL:-}
      - SENDER_PROBE_IMAP_HOST=${SENDER_PROBE_IMAP_HOST:-}
      - SENDER_PROBE_IMAP_PORT=${SENDER_PROBE_IMAP_PORT:-993}
      - SENDER_PROBE_IMAP_USER=${SENDER_PROBE_IMAP_USER:-}
      - SENDER_PROBE_IMAP_PASSWORD=${SENDER_PROBE_IMAP_PASSWORD:-}
      # Алерты мониторинга в TG: отправка встала, ящики отваливаются, bounce
      # rate домена. Без чата монитор работает (автопауза), но молчит.
      - SENDER_ALERTS_TELEGRAM_CHAT_ID=${SENDER_ALERTS_TELEGRAM_CHAT_ID:-}
      - SENDER_ALERTS_TELEGRAM_BOT_TOKEN=${SENDER_ALERTS_TELEGRAM_BOT_TOKEN:-}
      - SENDER_MONITOR_INTERVAL_MS=${SENDER_MONITOR_INTERVAL_MS:-300000}
      - WORKER_KIND=sender
    stop_grace_period: 2m
    # autoheal + heartbeat — защита от event-loop hang (инциденты tgOutreach
    # 35ч и yandexmaps 27.07.2026: процесс жив, письма не идут). Heartbeat
    # пишет независимый setInterval в worker/sender.ts; healthcheck читает
    # mtime файла, autoheal делает рестарт.
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/sender-worker-heartbeat && test $$(( $$(date +%s) - $$(cat /tmp/sender-worker-heartbeat | cut -c1-10) )) -lt 300 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
