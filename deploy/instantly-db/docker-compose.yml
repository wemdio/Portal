# DB infrastructure: Instantly (prod/dev) + Main Portal DB
# Deploy on a dedicated DB server, separate from the Portal app server.
#
# Host ports (avoid 5432/3000/3001 defaults on shared servers):
#   instantly prod: PG 35432, PostgREST 35401, pgAdmin 127.0.0.1:35410
#   instantly dev:  PG 35433, PostgREST 35402, pgAdmin 127.0.0.1:35411
#   main portal:    PG 35434, pgAdmin 127.0.0.1:35412
#
# Usage:
#   cp .env.example .env   # fill in passwords
#   docker compose up -d
#
# Migrator runs once on every `up` and applies pending SQL migrations.
# Backup container runs pg_dump on a cron schedule and uploads directly to S3.

services:
  # ─── PROD ──────────────────────────────────────────────────────────────────────

  instantly-postgres-prod:
    image: postgres:16-alpine
    container_name: instantly-postgres-prod
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
    environment:
      POSTGRES_DB: instantly
      POSTGRES_USER: instantly
      POSTGRES_PASSWORD: ${INSTANTLY_PROD_PG_PASSWORD}
    volumes:
      - prod-pg-data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:35432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instantly -d instantly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          # 2048M держали базу вплотную к потолку: 90% занято и 1.13 млн
          # срабатываний cgroup-лимита за 18 дней — постоянный сброс кэша,
          # хотя на хосте 62 ГБ и свободно больше сорока.
          memory: 5120M
          cpus: '1.0'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  instantly-postgrest-prod:
    image: postgrest/postgrest:v12.2.8
    container_name: instantly-postgrest-prod
    environment:
      PGRST_DB_URI: postgresql://instantly:${INSTANTLY_PROD_PG_PASSWORD}@instantly-postgres-prod:5432/instantly
      PGRST_DB_POOL: 10
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_DB_ANON_ROLE: instantly
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ${INSTANTLY_PROD_JWT_SECRET:-instantly-local-jwt-secret-change-in-prod}
    depends_on:
      instantly-postgres-prod:
        condition: service_healthy
    # 22.07.2026: postgrest/postgrest:v12.2.8 — distroless image, нет sh/wget.
    # CMD-SHELL healthcheck падает "no such file"; сам postgrest работает и
    # обслуживает запросы. Отключаем чтобы контейнер не был вечно unhealthy.
    healthcheck:
      disable: true
    ports:
      - "0.0.0.0:35401:3000"
    deploy:
      resources:
        limits:
          # 23.07.2026: PostgREST стабильно упирался в прежний лимит 128M
          # (127.9 MiB, 99.91%). Оставляем запас для рабочих пиков.
          memory: 4096M
          cpus: '0.2'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  instantly-pgadmin-prod:
    image: dpage/pgadmin4:9.3
    container_name: instantly-pgadmin-prod
    environment:
      PGADMIN_DEFAULT_EMAIL: ${INSTANTLY_PROD_PGADMIN_EMAIL:-admin@portal.local}
      PGADMIN_DEFAULT_PASSWORD: ${INSTANTLY_PROD_PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      instantly-postgres-prod:
        condition: service_healthy
    volumes:
      - prod-pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:35410:5050"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.2'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  # ─── DEV ───────────────────────────────────────────────────────────────────────

  instantly-postgres-dev:
    image: postgres:16-alpine
    container_name: instantly-postgres-dev
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_DB: instantly
      POSTGRES_USER: instantly
      POSTGRES_PASSWORD: ${INSTANTLY_DEV_PG_PASSWORD}
    volumes:
      - dev-pg-data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:35433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instantly -d instantly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  instantly-postgrest-dev:
    image: postgrest/postgrest:v12.2.8
    container_name: instantly-postgrest-dev
    environment:
      PGRST_DB_URI: postgresql://instantly:${INSTANTLY_DEV_PG_PASSWORD}@instantly-postgres-dev:5432/instantly
      PGRST_DB_POOL: 5
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_DB_ANON_ROLE: instantly
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ${INSTANTLY_DEV_JWT_SECRET:-instantly-dev-jwt-secret}
    depends_on:
      instantly-postgres-dev:
        condition: service_healthy
    # 22.07.2026: distroless image, см. коммент у postgrest-prod.
    healthcheck:
      disable: true
    ports:
      - "0.0.0.0:35402:3000"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  instantly-pgadmin-dev:
    image: dpage/pgadmin4:9.3
    container_name: instantly-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${INSTANTLY_DEV_PGADMIN_EMAIL:-admin@portal.local}
      PGADMIN_DEFAULT_PASSWORD: ${INSTANTLY_DEV_PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      instantly-postgres-dev:
        condition: service_healthy
    volumes:
      - dev-pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:35411:5050"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.2'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  # ─── MAIN PORTAL DB (Supabase-compatible Postgres) ────────────────────────────
  # Используем supabase/postgres — там предустановлены pgjwt, pg_graphql, pgvector,
  # pg_cron, pgsodium, supabase_vault. Эти расширения нужны для self-hosted стека
  # (GoTrue, PostgREST, Storage, Realtime).
  #
  # ВНИМАНИЕ: volume main-supabase-pg-data — отдельный, не используем старый
  # main-pg-data (тот был от postgres:16-alpine, версии несовместимы).

  main-postgres:
    image: supabase/postgres:15.8.1.060
    container_name: main-postgres
    profiles:
      - main-db
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${MAIN_PG_PASSWORD}
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      PGPASSWORD: ${MAIN_PG_PASSWORD}
      PGDATABASE: postgres
      JWT_SECRET: ${MAIN_JWT_SECRET}
      JWT_EXP: ${MAIN_JWT_EXP:-21600}
    volumes:
      - main-supabase-pg-data:/var/lib/postgresql/data
      - ./main-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "0.0.0.0:35434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          # Production Main DB is ~25 GB. 12 GB prevents cgroup OOM during
          # backup/traffic peaks; 8 CPUs prevents query workloads from being
          # throttled at the old 2-CPU ceiling. Keep in sync with main-db-prod.
          memory: 12288M
          cpus: '8.0'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  main-pgadmin:
    image: dpage/pgadmin4:9.3
    container_name: main-pgadmin
    profiles:
      - main-db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${MAIN_PGADMIN_EMAIL:-admin@portal.com}
      PGADMIN_DEFAULT_PASSWORD: ${MAIN_PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      main-postgres:
        condition: service_healthy
    volumes:
      - main-pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:35412:5050"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.2'
          pids: 512
    restart: unless-stopped
    networks:
      - instantly-network

  # ─── BACKUPS: local pg_dump for Main + Instantly → S3 ───────────────────
  # The service intentionally lives on the DB host: both database URLs use
  # Docker DNS, so pg_dump never crosses the WAN between the DB and Portal hosts.
  # It is profile-gated because an ordinary DB deploy must not recreate the
  # container in the middle of a running dump. Start/update it explicitly with:
  #   docker compose -p instantly-db --env-file .env --profile backup \
  #     up -d --no-deps portal-backup
  portal-backup:
    image: ${BACKUP_IMAGE:-dimakuladmed/portal-backup:prod}
    container_name: portal-backup
    profiles:
      - backup
    environment:
      # После миграции 21.07.2026 на 139:
      # - main-postgres в отдельном compose-проекте (main-supabase) → разные docker-сети
      #   → ходим через host-IP:host-port (публичный 35434).
      # - instantly-postgres-prod в этом же compose (instantly-network) → используем
      #   container-name (139-firewall режет self-loop на host-IP:35432 из контейнера).
      MAIN_SUPABASE_DATABASE_URL: postgresql://supabase_admin:${MAIN_PG_PASSWORD}@139.60.162.12:35434/postgres?sslmode=disable
      INSTANTLY_DATABASE_URL: postgresql://instantly:${INSTANTLY_PROD_PG_PASSWORD}@instantly-postgres-prod:5432/instantly?sslmode=disable
      INSTANTLY_DATASET_DATABASE_URL: postgresql://instantly:${INSTANTLY_PROD_PG_PASSWORD}@instantly-postgres-prod:5432/instantly_dataset?sslmode=disable
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-ru-1}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_REMOTE_RETENTION_DAYS: ${BACKUP_REMOTE_RETENTION_DAYS:-7}
      BACKUP_PG_DUMP_RETRIES: ${BACKUP_PG_DUMP_RETRIES:-3}
      BACKUP_PG_DUMP_RETRY_PAUSE: ${BACKUP_PG_DUMP_RETRY_PAUSE:-30}
      BACKUP_S3_UPLOAD_RETRIES: ${BACKUP_S3_UPLOAD_RETRIES:-3}
      BACKUP_S3_UPLOAD_RETRY_PAUSE: ${BACKUP_S3_UPLOAD_RETRY_PAUSE:-15}
      TELEGRAM_HEALTH_BOT_TOKEN: ${TELEGRAM_HEALTH_BOT_TOKEN:-}
      TELEGRAM_HEALTH_CHAT_ID: ${TELEGRAM_HEALTH_CHAT_ID:-}
    volumes:
      - portal-backup-data:/backups
    deploy:
      resources:
        limits:
          # 1G триггерил 90% алерт после каждого дампа: контейнер пакует 4 ГБ
          # main-supabase + 1.8 ГБ instantly в tar и льёт в S3 → page cache
          # (active_file) держится в memory.current ещё несколько часов. Поднято
          # до 2G, чтобы пиковый RSS pg_dump + буферы aws s3 cp не сжигали лимит.
          memory: 2G
          cpus: '1.0'
          pids: 512
    # entrypoint waits for an active dump + S3 upload before exiting.
    stop_grace_period: 4h
    restart: unless-stopped
    networks:
      - instantly-network

  # ─── MIGRATOR ──────────────────────────────────────────────────────────────────
  # Applies pending SQL migrations to both prod and dev databases on every `up`.

  instantly-migrator:
    image: node:20-alpine
    container_name: instantly-migrator
    working_dir: /app
    volumes:
      - ./migrations:/app/supabase/instantly-migrations:ro
      - ./scripts:/app/scripts:ro
    environment:
      INSTANTLY_PROD_DATABASE_URL: postgresql://instantly:${INSTANTLY_PROD_PG_PASSWORD}@instantly-postgres-prod:5432/instantly
      INSTANTLY_DEV_DATABASE_URL: postgresql://instantly:${INSTANTLY_DEV_PG_PASSWORD}@instantly-postgres-dev:5432/instantly
    depends_on:
      instantly-postgres-prod:
        condition: service_healthy
      instantly-postgres-dev:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        cd /app
        npm install --no-save pg dotenv 2>/dev/null
        echo "[migrator] Applying migrations to PROD..."
        INSTANTLY_DATABASE_URL="$$INSTANTLY_PROD_DATABASE_URL" node scripts/db/ensureDatabase.js
        echo "[migrator] Applying migrations to DEV..."
        INSTANTLY_DATABASE_URL="$$INSTANTLY_DEV_DATABASE_URL" node scripts/db/ensureDatabase.js
        echo "[migrator] Done."
    restart: "no"
    networks:
      - instantly-network

volumes:
  prod-pg-data:
  prod-pgadmin-data:
  dev-pg-data:
  dev-pgadmin-data:
  main-supabase-pg-data:
  main-pgadmin-data:
  portal-backup-data:

networks:
  instantly-network:
    driver: bridge
