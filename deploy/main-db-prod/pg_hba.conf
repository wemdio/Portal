# Правила входа в main-postgres (прод 139). Монтируется в /etc/postgresql/pg_hba.conf.
#
# 27.10.2026: из интернета входят только роли аналитиков readonly и nick_ro
# (коннектор «Portal DB», Codex / Claude Code). Главные роли (postgres,
# supabase_admin, supabase_storage_admin), authenticator и прочие — только из
# Docker-сетей, с localhost и через WireGuard (10.0.0.0/8). До этого строка
# `0.0.0.0/0 scram-sha-256` пускала любую роль с любого адреса по паролю.
#
# Файл совпадает с тем, что применён на проде 27.10 (pg_reload_conf), включая две
# последние строки — после reject до них уже никто не доходит.
# Правка: изменить файл на сервере в /opt/main-db/pg_hba.conf, затем
#   docker exec -i main-postgres psql -X -U postgres -d postgres -A \
#     -c "select line_number, error from pg_hba_file_rules where error is not null;"
# (0 строк) и `select pg_reload_conf();`. Перезапуск базы не нужен.

local all  supabase_admin     scram-sha-256
local all  all                peer map=supabase_map
host  2gis_dataset  twogis_ve2  172.16.0.0/12  scram-sha-256
host  all           twogis_ve2  all            reject
host  all  all  127.0.0.1/32  trust
host  all  all  ::1/128       trust
host  all  all  10.0.0.0/8  scram-sha-256
host  all  all  172.16.0.0/12  scram-sha-256
host  all  all  192.168.0.0/16  scram-sha-256
host  all  readonly,nick_ro  0.0.0.0/0  scram-sha-256
host  all  all  0.0.0.0/0  reject
host  all  readonly,nick_ro  ::/0  scram-sha-256
host  all  all  ::/0  reject
host  all  all  0.0.0.0/0     scram-sha-256
host  all  all  ::0/0     scram-sha-256
