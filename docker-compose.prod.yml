      - INSTANTLY_SYNC_INTERVAL_SEC=${INSTANTLY_SYNC_INTERVAL_SEC}
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  # pg_dump-бэкапы обеих БД (Supabase main + Instantly local PG) → Supabase Storage.
  # Cron внутри контейнера; см. services/backup/crontab.
  # Восстановление и подробности — docs/instantly-local-pg-cutover.md.
  portal-backup:
    image: ${DOCKER_USERNAME}/portal-backup:prod
    container_name: portal-backup
    env_file:
      - .env
    environment:
      # Источники для pg_dump (URL — те же, что использует приложение).
      - MAIN_SUPABASE_DATABASE_URL=${MAIN_SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}
      - INSTANTLY_DATABASE_URL=${INSTANTLY_DATABASE_URL:-}
      - INSTANTLY_DEV_DATABASE_URL=${INSTANTLY_DEV_DATABASE_URL:-}
      # Куда грузим (bucket deploy-backups). По умолчанию — основной Supabase
      # проект Portal (можно переопределить отдельным проектом-«хранилищем»).
      - BACKUP_SUPABASE_URL=${BACKUP_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}
      - BACKUP_SUPABASE_KEY=${BACKUP_SUPABASE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_REMOTE_RETENTION_DAYS=${BACKUP_REMOTE_RETENTION_DAYS:-30}
      # Алерты при падении pg_dump или upload.
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN:-}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID:-}
    volumes:
      - portal-backup-data:/backups
    deploy:
      resources:
        limits:
          # 1 ГБ + 1 CPU нужны pg_dump для главной Supabase БД (несколько ГБ
          # данных, --compress=6 жмёт в один поток). Прежний лимит 256M убивал
          # curl OOM-ом при стриминге (даже после перехода на -T --upload-file
          # хочется иметь запас на pg_dump + tr/sed/find в cleanup_remote).
          # См. services/backup/backup.sh комментарий про curl/curl#18300.
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - portal-network

  atmos-bot:
    image: ${DOCKER_USERNAME}/portal-atmos-bot:prod
    container_name: portal-atmos-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_ATMOS_BOT_TOKEN=${TELEGRAM_ATMOS_BOT_TOKEN}
      - TELEGRAM_ATMOS_TEAM_CHAT_ID=${TELEGRAM_ATMOS_TEAM_CHAT_ID}
      - ATMOS_ALLOWED_TG_USER_IDS=${ATMOS_ALLOWED_TG_USER_IDS}
      - OPENROUTER_ATMOS_API_KEY=${OPENROUTER_ATMOS_API_KEY}
      - ATMOS_WEBHOOK_PORT=${ATMOS_WEBHOOK_PORT:-8090}
      - ATMOS_WEBHOOK_URL=${ATMOS_WEBHOOK_URL}
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    restart: unless-stopped
    networks:
      - portal-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: portal-telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portal-guacd
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  rdp-ws:
    image: ${DOCKER_USERNAME}/portal-rdp-ws:prod
    container_name: portal-rdp-ws
    depends_on:
      - guacd
    env_file:
      - .env
    environment:
      - RDP_WS_SECRET=${RDP_WS_SECRET}
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    restart: unless-stopped
    networks:
      - portal-network

volumes:
  telegram-bot-api-data:
  portal-backup-data:

networks:
  portal-network:
    driver: bridge
