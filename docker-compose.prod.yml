# Лимиты memory+cpus — потолки; суммы ≤90-95 % от 32 vCPU / 64 GB RAM.
# Сервер: 2×Xeon E5-2670 (16C/32T) / 64 GB / 1 TB HDD SFF / HW RAID / 2×PSU.
# CPU: 29.15 / 32 = 91 %; RAM: 61 184 / 65 536 = 93 %. Остаток — ОС и Docker daemon.
#
# 2026-06-10: убран worker-enrich-10 (-2 GB / -1 CPU), добавлен openoutreach
# (+2.56 GB / +1.5 CPU). Чистый delta: +0.56 GB / +0.5 CPU. Enrich-pool теперь
# 9 реплик вместо 10 (по комментарию ниже пул overcapped, throughput-impact
# минимальный). См. docs/superpowers/specs/2026-06-10-openoutreach-portal-native-design.md.
services:
  portal:
    image: ${DOCKER_USERNAME}/portal:prod
    container_name: portal
    depends_on:
      - yandexmaps
      - telegram-bot-api
      - transcribe-worker
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/host.env
    # 10.06.2026 (Claude): SSR-запросы контейнера к https://polza-portal.ru ловили
    # спорадический DNS EAI_AGAIN -> 500 (auth profile / support-unread).
    # Резолвим хост локально через host-gateway, как у health-check ниже.
    extra_hosts:
      - "polza-portal.ru:host-gateway"
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - NODE_ENV=production
      - BODY_SIZE_LIMIT=600mb
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - INSTANTLY_DATABASE_URL=${INSTANTLY_DATABASE_URL}
      - INSTANTLY_SUPABASE_URL=${INSTANTLY_SUPABASE_URL}
      - INSTANTLY_SUPABASE_SERVICE_ROLE_KEY=${INSTANTLY_SUPABASE_SERVICE_ROLE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TG_TRANSCRIBE_BOT_TOKEN=${TG_TRANSCRIBE_BOT_TOKEN}
      - LEAD_ALERTS_TELEGRAM_BOT_TOKEN=${LEAD_ALERTS_TELEGRAM_BOT_TOKEN:-}
      - LEAD_HANDOFF_WEBHOOK_SECRET=${LEAD_HANDOFF_WEBHOOK_SECRET:-}
      - TG_LOCAL_API_URL=http://telegram-bot-api:8081
      - HH_PROXY_URL=${HH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - POLZA_CRED_KEY=${POLZA_CRED_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AI_CALLER_PROVIDER=${AI_CALLER_PROVIDER:-vapi}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - OPENROUTER_VIDEO_TRANSCRIPT_API_KEY=${OPENROUTER_VIDEO_TRANSCRIPT_API_KEY}
      - OPENROUTER_SALES_COPILOT_API_KEY=${OPENROUTER_SALES_COPILOT_API_KEY}
      - OPENROUTER_EMAIL_SEQUENCE_API_KEY=${OPENROUTER_EMAIL_SEQUENCE_API_KEY}
      - OPENROUTER_EMAIL_SEQUENCE_V2_API_KEY=${OPENROUTER_EMAIL_SEQUENCE_V2_API_KEY}
      - MAIN_S3_ENDPOINT=${MAIN_S3_ENDPOINT}
      - MAIN_S3_REGION=${MAIN_S3_REGION:-ru-1}
      - MAIN_S3_BUCKET=${MAIN_S3_BUCKET}
      - MAIN_S3_ACCESS_KEY_ID=${MAIN_S3_ACCESS_KEY_ID}
      - MAIN_S3_SECRET_ACCESS_KEY=${MAIN_S3_SECRET_ACCESS_KEY}
      - AI_CALLER_TG_BOT_TOKEN=${AI_CALLER_TG_BOT_TOKEN}
      - TELEGRAM_ATMOS_BOT_TOKEN=${TELEGRAM_ATMOS_BOT_TOKEN}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-local}
      - TRANSCRIPTION_WORKER_URL=http://transcribe-worker:8070
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_BYPASS_TOKEN=${MAINTENANCE_BYPASS_TOKEN}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-8}
      - NODE_OPTIONS=--max-old-space-size=3072
      - TG_TARGET_API_ID=${TG_TARGET_API_ID}
      - TG_TARGET_API_HASH=${TG_TARGET_API_HASH}
      - TG_TARGET_SESSION=${TG_TARGET_SESSION}
    healthcheck:
      # 127.0.0.1, НЕ localhost: next 16.2.x слушает только IPv4 (0.0.0.0:3000), а
      # localhost в контейнере резолвится сначала в ::1 (IPv6) → wget localhost
      # ловит connection refused и healthcheck ложно красит контейнер unhealthy
      # (сайт при этом полностью жив через IPv4/nginx). См. инцидент 07.06.2026.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 26624M
          cpus: '11'
    restart: unless-stopped
    networks:
      - portal-network

  worker-hh:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-hh
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      # HH parser jobs routinely scrape tens of thousands of vacancies; 15min was
      # a copy-paste leftover from email-validation that started killing real jobs
      # at 44-68% progress. Bumped to 180 (3h) — matches stop_grace_period above.
      - WORKER_DRAIN_TIMEOUT_MINUTES=${HH_WORKER_DRAIN_TIMEOUT_MINUTES:-180}
      - WORKER_KIND=hh
    stop_grace_period: 3h
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-eng-hiring:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-eng-hiring
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=enghiring
    stop_grace_period: 3h
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '0.75'
    restart: unless-stopped
    networks:
      - portal-network

  worker-search:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-search
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      # Search parser drains huge result sets too — same reasoning as worker-hh.
      - WORKER_DRAIN_TIMEOUT_MINUTES=${SEARCH_WORKER_DRAIN_TIMEOUT_MINUTES:-180}
      - WORKER_KIND=search
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped
    networks:
      - portal-network

  # Шаблон конфигурации enrich-воркера. Подгружается через `<<: *worker-enrich`
  # в worker-enrich / worker-enrich-2 / worker-enrich-3 ниже — три реплики
  # делят одну очередь Supabase через FOR UPDATE SKIP LOCKED, так что каждый
  # job-item получает только одна реплика.
  worker-enrich: &worker-enrich
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-enrich
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
      - WORKER_KIND=enrich
      # Тюнинг производительности email/text/signals enrichment'а:
      # - WEBSITE_ENRICHMENT_CONCURRENCY: сколько сайтов в одном job'е скрапится
      #   параллельно (15 → 25). Domain-throttle (=1 на домен) ограничивает
      #   нагрузку на target-сайты, так что boost не вызовет ban'ов.
      # - ENRICH_MAX_CONCURRENCY: сколько job'ов одна реплика обслуживает
      #   одновременно. Параллельно работают 3 реплики (worker-enrich/-2/-3),
      #   итого ~3 × 25 = 75 URL в полёте против ~3 × 8 = 24 job'ов в очереди.
      # Memory limit держим 2G — реальный peak в проде при concurrency=25
      # на job ≈ ~900-1100MB (cheerio HTML + Playwright temp). 2G с запасом.
      - WEBSITE_ENRICHMENT_CONCURRENCY=${WEBSITE_ENRICHMENT_CONCURRENCY:-25}
      - ENRICH_MAX_CONCURRENCY=${ENRICH_MAX_CONCURRENCY:-8}
      # Coordinator pattern всегда включён (см. lib/enrich/enrichBuffer.ts):
      # scraper пишет результат в website_enrichment_results_buffer одной
      # строкой, worker-enrich-coordinator batch'ит в queue/cache/jobs.
      # Подключения к БД от scraper'а не растут линейно с числом реплик.
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1'
    restart: unless-stopped
    networks:
      - portal-network

  worker-enrich-2:
    <<: *worker-enrich
    container_name: portal-worker-enrich-2

  worker-enrich-3:
    <<: *worker-enrich
    container_name: portal-worker-enrich-3

  # ─── Дополнительные scraper-реплики ────────────────────────────────────
  # Активны независимо от ENRICH_USE_BUFFER. В legacy-режиме делят очередь
  # через SKIP LOCKED как и -2/-3. В buffer-режиме пишут в один общий
  # buffer и один coordinator всё агрегирует — DB-пул не растёт линейно.
  worker-enrich-4: { <<: *worker-enrich, container_name: portal-worker-enrich-4 }
  worker-enrich-5: { <<: *worker-enrich, container_name: portal-worker-enrich-5 }
  worker-enrich-6: { <<: *worker-enrich, container_name: portal-worker-enrich-6 }
  worker-enrich-7: { <<: *worker-enrich, container_name: portal-worker-enrich-7 }
  worker-enrich-8: { <<: *worker-enrich, container_name: portal-worker-enrich-8 }
  worker-enrich-9: { <<: *worker-enrich, container_name: portal-worker-enrich-9 }
  # worker-enrich-10 убран 2026-06-10: освобождает 2 GB / 1 CPU под
  # openoutreach (см. сервис ниже). Если когда-нибудь захочется вернуть —
  # просто откоммитить эту строку и пересчитать суммы вверху.

  # ─── Single-writer coordinator для buffer'а ────────────────────────────
  # Запускать ровно ОДНУ реплику. Drain RPC SKIP-LOCKED'нится между несколькими
  # инстансами, но смысла в 2+ нет — flush jobs counter всё равно сериализуется
  # на per-job RPC. Поднимать 2-ю реплику только как hot-standby при апгрейде.
  worker-enrich-coordinator:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-enrich-coordinator
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Polling интервал короткий — buffer всё равно подписан на Realtime,
      # этот таймаут только fallback на случай если канал заглох.
      - WORKER_POLL_INTERVAL_MS=${ENRICH_COORDINATOR_POLL_MS:-1000}
      - WORKER_KIND=enrich-coordinator
      - ENRICH_COORDINATOR_BATCH=${ENRICH_COORDINATOR_BATCH:-100}
      - WEBSITE_ENRICHMENT_CACHE_DAYS=${WEBSITE_ENRICHMENT_CACHE_DAYS:-7}
      - WEBSITE_ENRICHMENT_ERROR_TTL_HOURS=${WEBSITE_ENRICHMENT_ERROR_TTL_HOURS:-6}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-yandexmaps:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-yandexmaps
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
      - WORKER_KIND=yandexmaps
    depends_on:
      - yandexmaps
    stop_grace_period: 30m
    deploy:
