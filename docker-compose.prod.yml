      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_BUGOR_API_KEY=${OPENROUTER_BUGOR_API_KEY}
      - OPENROUTER_BRIEF_API_KEY=${OPENROUTER_BRIEF_API_KEY}
      - INSTANTLY_API_KEY=${INSTANTLY_API_KEY}
      - INSTANTLY_PORTAL_API_KEY=${INSTANTLY_PORTAL_API_KEY}
      - SMTP_PROXY_URL=${SMTP_PROXY_URL}
      - SMTP_PROXY_URLS=${SMTP_PROXY_URLS}
      - SMTP_PROXY_API_KEY=${SMTP_PROXY_API_KEY}
