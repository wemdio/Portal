      - SMTP_PROXY_API_KEY=${SMTP_PROXY_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=outreach
    stop_grace_period: 10m
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  worker-li-outreach:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-li-outreach
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_LI_OUTREACH_API_KEY=${OPENROUTER_LI_OUTREACH_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - LI_CAMPAIGN_TICK_INTERVAL_MS=${LI_CAMPAIGN_TICK_INTERVAL_MS:-300000}
      - WORKER_KIND=lioutreach
    stop_grace_period: 5m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Конструктор баз. Выносит «pipeline для CSV/Excel баз» из HTTP-процесса
  # portal'a в отдельные долгоживущие контейнеры. 12 реплик (worker-
  # baseconstructor / -2 ... -12) делят одну очередь base_constructor_jobs через
  # атомарный CAS-claim (UPDATE WHERE status='pending') - каждый job берёт
  # ровно одна реплика. Параллельно: 12 реплик x 1 job = 12 job'ов.
  # Реплики дают отказоустойчивость: краш/OOM одной не уносит job'ы остальных.
  # Задачи с истёкшей или обнулённой арендой (lease_until) любая реплика
  # автоматически перехватывает и продолжает с того шага, где остановились.
  worker-baseconstructor: &worker-baseconstructor
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-baseconstructor
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_BRIEF_API_KEY=${OPENROUTER_BRIEF_API_KEY}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - OPENROUTER_CLEANUP_API_KEY=${OPENROUTER_CLEANUP_API_KEY}
      - PROXY_URLS=${PROXY_URLS}
      - SMTP_PROXY_URL=${SMTP_PROXY_URL}
      - SMTP_PROXY_URLS=${SMTP_PROXY_URLS}
      - SMTP_PROXY_API_KEY=${SMTP_PROXY_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=baseconstructor
      # Сколько job'ов параллельно НА ОДНУ реплику. Фиксируем ровно 1: отдельные
      # контейнеры изолируют heap/OOM и позволяют наращивать мощность по одной
      # реплике, не делая скачок concurrency сразу во всём пуле.
      # 1 job в памяти обычно ~0.5-1.5GB JS heap из-за большой `data` (string[][]).
      # Глобальный потолок — общий main-rest/Postgres, AI-роутер и скрейпинг.
      # Это НЕ то же, что per-user cap MAX_ACTIVE_JOBS_PER_USER=6 в route.ts.
      - BASE_CONSTRUCTOR_CONCURRENCY=1
      # Per-job fan-out скрейпинга (find_emails/enrich). На 12 параллельных
      # job'ах библиотечные дефолты 15+5 дали бы до ~240 исходящих коннектов.
      # Для base-constructor держим 10+6 = до ~192; env можно откатить без
      # правки кода. DFYB эти env не ставит -> у него остаются дефолты 15/5.
      - BASE_EMAIL_SCRAPE_CONCURRENCY=${BASE_EMAIL_SCRAPE_CONCURRENCY:-10}
      - BASE_ENRICH_SCRAPE_CONCURRENCY=${BASE_ENRICH_SCRAPE_CONCURRENCY:-6}
      # 60s возвращают запас времени для retry/fallback-цепочки.
      - BASE_ENRICH_PER_SITE_TIMEOUT_MS=${BASE_ENRICH_PER_SITE_TIMEOUT_MS:-60000}
      # У двенадцати воркеров общий Requesty-ключ: по одной AI-пачке на job
      # даёт до 12 одновременных вызовов без неконтролируемого fan-out.
      - BASE_TA_SCORING_CONCURRENCY=${BASE_TA_SCORING_CONCURRENCY:-1}
      - BASE_CONSTRUCTOR_LEASE_SECONDS=${BASE_CONSTRUCTOR_LEASE_SECONDS:-300}
    # Job может занимать 30-60 минут (find_emails+enrich на 1.5к строк), но
    # ждать его завершения на SIGTERM незачем: задача не должна доиграть — она
    # резюмится с чекпоинта в другой реплике. Воркеру нужны секунды, чтобы
    # обнулить аренду своих задач (два прохода с паузой в секунду), после чего
    # соседняя реплика подберёт их на ближайшем опросе.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # Первые три реплики сохраняют исторический запас 10GB для очень
          # больших баз; concurrency=1 не позволяет одной реплике взять две.
          memory: 10240M
          cpus: '3'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Реплики base-constructor. Делят очередь base_constructor_jobs через
  # атомарный CAS-claim, как enrich-реплики. Всего 12 x concurrency(1) = 12.
  worker-baseconstructor-2:
    <<: *worker-baseconstructor
    container_name: portal-worker-baseconstructor-2

  worker-baseconstructor-3:
    <<: *worker-baseconstructor
    container_name: portal-worker-baseconstructor-3

  # Реплики 4-6 прошли production-canary 20.08.2026; реплики 7-12 используют те
  # же проверенные консервативные параметры.
  # Ограничиваем каждую одной CPU и 4GB: это ровно те параметры, на которых
  # временные реплики прошли проверку без OOM/restart и деградации health.
  worker-baseconstructor-4: &worker-baseconstructor-conservative
    <<: *worker-baseconstructor
    container_name: portal-worker-baseconstructor-4
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '1'
          pids: 512

  worker-baseconstructor-5:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-5

  worker-baseconstructor-6:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-6

  worker-baseconstructor-7:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-7

  worker-baseconstructor-8:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-8

  worker-baseconstructor-9:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-9

  worker-baseconstructor-10:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-10

  worker-baseconstructor-11:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-11

  worker-baseconstructor-12:
    <<: *worker-baseconstructor-conservative
    container_name: portal-worker-baseconstructor-12

  worker-instantly-leads:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-instantly-leads
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - INSTANTLY_SUPABASE_URL=${INSTANTLY_SUPABASE_URL}
      - INSTANTLY_SUPABASE_SERVICE_ROLE_KEY=${INSTANTLY_SUPABASE_SERVICE_ROLE_KEY}
      - INSTANTLY_API_KEY=${INSTANTLY_API_KEY}
      - INSTANTLY_PORTAL_API_KEY=${INSTANTLY_PORTAL_API_KEY}
      - OPENROUTER_INSTANTLY_LEAD_API_KEY=${OPENROUTER_INSTANTLY_LEAD_API_KEY}
      - INSTANTLY_LEAD_QUAL_MODEL=${INSTANTLY_LEAD_QUAL_MODEL}
      - CHANGELOG_BOT_TOKEN=${CHANGELOG_BOT_TOKEN}
      - LEAD_ALERTS_TELEGRAM_BOT_TOKEN=${LEAD_ALERTS_TELEGRAM_BOT_TOKEN:-}
      - LEAD_ALERTS_TELEGRAM_CHAT_ID=${LEAD_ALERTS_TELEGRAM_CHAT_ID:-}
      - LEAD_ALERTS_TELEGRAM_THREAD_ID=${LEAD_ALERTS_TELEGRAM_THREAD_ID:-}
      - LEAD_HANDOFF_ENABLED=${LEAD_HANDOFF_ENABLED:-false}
      - LEAD_HANDOFF_MODEL=${LEAD_HANDOFF_MODEL:-}
      - WORKER_POLL_INTERVAL_MS=30000
      - WORKER_KIND=instantlyleads
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          # 256M не хватало: за семь часов после деплоя воркер упирался в
          # лимит 768 раз и стоял на 82%. Убит по памяти не был, но запаса
          # не оставалось вовсе.
          memory: 1G
          cpus: '0.25'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  transcribe-worker:
    image: ${DOCKER_USERNAME}/portal-transcribe-worker:prod
    container_name: portal-transcribe-worker
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-}
      # 4 parallel jobs on 6 cores. Worker auto-splits cpu_threads = cores /
      # MAX_CONCURRENT (= 1 thread/job here) and passes num_workers=4 into
      # faster-whisper so ctranslate2 doesn't internally serialize. Bumping
      # to 4 turned the queue from "1 job at a time" → "4 in flight" — see
      # 29.06 incident, audio-transcribe UI was stuck on "Подготовка файла…"
      # for hours because all earlier jobs were waiting on the semaphore.
      - MAX_CONCURRENT=${TRANSCRIBE_MAX_CONCURRENT:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # 25.07.2026: 4 GiB упирался в 88% под MAX_CONCURRENT=4 (4 копии
          # faster-whisper держат каждая буфер аудио + активации). Health-check
          # алерты 🟡 memory 88% шли раз в 15 мин. Поднято до 6 GiB — запас
          # без OOM-риска, сервер имеет ресурс.
          memory: 6144M
          cpus: '6'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  yandexmaps:
    image: ${DOCKER_USERNAME}/portal-yandexmaps:prod
    container_name: portal-yandexmaps
    # 10.06.2026 (Claude): chromium-потомки скрапера не собираются (reaping) ->
    # сотни zombie за день (сегодня 342). init: true = tini в роли PID 1.
    init: true
    environment:
      - YANDEXMAPS_CONCURRENCY=2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8192M
          cpus: '3'
          pids: 512
    restart: unless-stopped
    ports:
      # ТОЛЬКО localhost: воркер ходит через docker-сеть (yandexmaps:8000),
      # наружу порт не нужен. С "8010:8000" API парсера торчал в интернет —
      # 14.07.2026 в логах uvicorn сканеры (GET / c внешних IP): любой мог
      # гонять наши прокси через /collect-links без авторизации.
      - "127.0.0.1:8010:8000"
    networks:
      - portal-network

  googleparsers:
    image: ${DOCKER_USERNAME}/portal-googleparsers:prod
    container_name: portal-googleparsers
    environment:
      - GOOGLE_MAPS_PLACE_CONCURRENCY=${GOOGLE_MAPS_PLACE_CONCURRENCY:-4}
    # Playwright/Chromium children — same reaping story as yandexmaps.
    init: true
    restart: unless-stopped
    networks:
      - portal-network

  polza-reports:
    image: ${DOCKER_USERNAME}/portal-polza-reports:prod
    container_name: portal-polza-reports
    # Stateless Coldy scraper + Trigga CSV → xlsx. Reached only from the portal
    # service inside portal-network; no port exposed publicly.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  health-check:
    image: ${DOCKER_USERNAME}/portal-health-check:prod
    container_name: portal-health-check
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
      - HEALTH_PORTAL_URL=${HEALTH_PORTAL_URL:-https://polza-portal.ru}
      - HEALTH_INTERVAL_SEC=${HEALTH_INTERVAL_SEC:-900}
      - HEALTH_JOB_MONITOR_INTERVAL_SEC=${HEALTH_JOB_MONITOR_INTERVAL_SEC:-300}
      # Держать строго выше ПОЛНОГО времени самопочинки у конструктора баз.
      # Оно складывается: порог простоя прогресса (BASE_CONSTRUCTOR_STALL_MINUTES,
      # 10 мин) + не больше одной аренды (BASE_CONSTRUCTOR_LEASE_SECONDS, 300 с)
      # + не больше одного опроса соседней реплики (30 с) ≈ 16 минут. Чистый
      # редеплой отдаёт задачу за секунды и в эту сумму не входит. При равных
      # значениях каждый деплой давал ложную тревогу за секунды до самоподбора
      # (инцидент 11.08.2026); 20 минут против 16 оставляют рабочий запас.
      - HEALTH_JOB_STUCK_MIN=${HEALTH_JOB_STUCK_MIN:-20}
      - HEALTH_SERVER_IP=${HEALTH_SERVER_IP:-139.60.162.12}
      - PROXY_URLS=${PROXY_URLS}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - HEALTH_DISK_TOTAL_GB=${HEALTH_DISK_TOTAL_GB:-80}
      - HEALTH_DISK_WARN_GB=${HEALTH_DISK_WARN_GB:-72}
      # Порог для нового per-container watchdog (см. check_container_resources
      # в main.py). Кидает жёлтый алерт когда контейнер съел >= X% cgroup-лимита
      # по памяти ИЛИ CPU-quota. 0 отключает проверку.
      - HEALTH_CONTAINER_USAGE_PCT=${HEALTH_CONTAINER_USAGE_PCT:-80}
    # Резолв публичного хоста в IP хоста, чтобы проверять именно https://polza-portal.ru с того же сервера
    extra_hosts:
      - "polza-portal.ru:host-gateway"
    volumes:
      # Read-only docker socket для per-container watchdog (memory/CPU vs limit).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Слушает docker events; если контейнер exit'нулся >= 5 раз за 10 мин —
  # принудительно останавливает его и шлёт TG-алерт в HEALTH-чат.
  # Защита от паттерна, дважды ронявшего сервер:
  #   22.07.2026 postgrest healthcheck loop (15 ч → hang),
  #   23.07.2026 21:00 MSK leads-report-bot exit loop (10 мин → hang).
  # Требует rw-доступ к docker.sock (нужны docker update + docker stop).
  loop-watchdog:
    image: ${DOCKER_USERNAME}/portal-loop-watchdog:prod
    container_name: portal-loop-watchdog
    environment:
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WATCHDOG_WINDOW_SEC=${WATCHDOG_WINDOW_SEC:-600}
      - WATCHDOG_THRESHOLD=${WATCHDOG_THRESHOLD:-5}
      - WATCHDOG_SELF_NAME=portal-loop-watchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
          pids: 128
    restart: unless-stopped
    networks:
      - portal-network

  instantly-sync-bot:
    image: ${DOCKER_USERNAME}/portal-instantly-sync-bot:prod
    container_name: portal-instantly-sync-bot
    env_file:
      - .env
    environment:
      - POLZA_INSTANTLY_SYNC_BOT_API_KEY=${POLZA_INSTANTLY_SYNC_BOT_API_KEY}
      - INSTANTLY_API_KEY=${INSTANTLY_API_KEY}
      - INSTANTLY_PORTAL_API_KEY=${INSTANTLY_PORTAL_API_KEY}
      - INSTANTLY_DATABASE_URL=${INSTANTLY_DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - INSTANTLY_SYNC_BOT_CHAT_ID=${INSTANTLY_SYNC_BOT_CHAT_ID}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
      - INSTANTLY_LEADS_CONCURRENCY=${INSTANTLY_LEADS_CONCURRENCY:-2}
      - INSTANTLY_LEADS_INTER_PAGE_DELAY_SEC=${INSTANTLY_LEADS_INTER_PAGE_DELAY_SEC:-0.5}
      - INSTANTLY_LEADS_PAGE_LIMIT=${INSTANTLY_LEADS_PAGE_LIMIT:-100}
      - INSTANTLY_LEADS_HTTP_TIMEOUT_SEC=${INSTANTLY_LEADS_HTTP_TIMEOUT_SEC:-120}
      - INSTANTLY_LEADS_RPS_LIMIT=${INSTANTLY_LEADS_RPS_LIMIT:-3.0}
      - INSTANTLY_SYNC_INTERVAL_SEC=${INSTANTLY_SYNC_INTERVAL_SEC}
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Ежедневный синк внешних источников (Метрика / AMO / Точка / Т-Банк) в main-postgres.
  # Расписание cron '30 14 * * *' UTC (= 17:30 МСК) через APScheduler, чтобы
  # свежие данные были готовы к записи в Google Sheets в 17:00 МСК.
  #
  # На старте контейнер проверяет текущее время по МСК: если попадает в окно
  # [17:30, 18:00) — синк запускается сразу (догоняем пропущенный cron после
  # деплоя). Вне окна — просто ждём следующего cron, не тратим API-запросы
  # на каждый рестарт в течение дня. UPSERT-таблицы делают любой повторный
  # прогон безопасным.
  #
  # Логи бинд-маунтятся на хост в /var/log/portal-external-sync/, чтобы
  # переживать docker rm -f при деплое (иначе история stdout уходит вместе
  # с контейнером). Внутри контейнера пишутся через tee — виден как в
  # `docker logs`, так и в файле на хосте `tail /var/log/portal-external-sync/main.log`.
  portal-external-sync:
    image: ${DOCKER_USERNAME}/portal-external-sync:prod
    container_name: portal-external-sync
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      # Пайплайн отчётов: sync 16:30 МСК → запись в Google Sheets и TG-summary
      # Егору в 17:00 МСК пт. Между sync и репортами 30 минут — успевает
      # подтянуть свежие сделки из AMO до формирования отчёта.
      - EXTERNAL_SYNC_CRON=${EXTERNAL_SYNC_CRON:-30 13 * * *}  # 13:30 UTC = 16:30 МСК
      - EXTERNAL_SYNC_STARTUP_WINDOW_START_MSK=${EXTERNAL_SYNC_STARTUP_WINDOW_START_MSK:-16:30}
      - EXTERNAL_SYNC_STARTUP_WINDOW_END_MSK=${EXTERNAL_SYNC_STARTUP_WINDOW_END_MSK:-17:00}
      - YANDEX_METRIKA_TOKEN=${YANDEX_METRIKA_TOKEN:-}
      - YANDEX_METRIKA_COUNTER_ID=${YANDEX_METRIKA_COUNTER_ID:-62363425}
      - YANDEX_METRIKA_LOOKBACK_DAYS=${YANDEX_METRIKA_LOOKBACK_DAYS:-30}
      - AMOCRM_TOKEN=${AMOCRM_TOKEN:-}
      - AMO_ACCESS_TOKEN=${AMO_ACCESS_TOKEN:-}
      - AMO_BASE_URL=${AMO_BASE_URL:-}
      - AMO_FIELD_YM_CLIENT_ID=${AMO_FIELD_YM_CLIENT_ID:-}
      # Т-Банк: по одному токену на бизнес студии, второй необязателен.
      # Номера счетов конфигом не задаются — источник спрашивает их у банка
      # (GET /bank-accounts) для каждого токена. Бывший TBANK_ACCOUNT убран:
      # в окружении он никогда не был задан, синк ходил по номеру, зашитому
      # в исходник, и второму бизнесу этот номер не подходит — это счёт
      # первого.
      - TBANK_TOKEN=${TBANK_TOKEN:-}
      - TBANK_TOKEN_2=${TBANK_TOKEN_2:-}
      - TOCHKA_JWT=${TOCHKA_JWT:-}
      - BANK_OWN_INN=${BANK_OWN_INN:-165808519703}
      # Brocard: виртуальные карты для зарубежных SaaS, расходная сторона.
      # Ключ один на аккаунт; пусто → источник поднимает NotImplementedError,
      # прогон логируется как 'partial', остальные источники не страдают.
      # BROCARD_CARD_TITLE — название карты, расходы которой собираем. Пусто =
      # значение по умолчанию из sources/brocard.py (DEFAULT_CARD_TITLE);
      # переменная нужна на случай, если владелец переименует карту или
      # заведёт вторую с тем же названием. Пустой фильтр НЕ означает «все
      # карты аккаунта» — это утянуло бы в расходы студии чужие покупки.
      - BROCARD_API_KEY=${BROCARD_API_KEY:-}
      - BROCARD_CARD_TITLE=${BROCARD_CARD_TITLE:-}
      # USDT TRC-20 (сеть Tron): входящие переводы на кошелёк студии, источник
      # crypto_usdt. Адрес кошелька в репозиторий не кладём — он приезжает
      # только из окружения; пусто → источник поднимает NotImplementedError,
      # прогон логируется как 'partial', остальные источники не страдают.
      # Ключ TronGrid необязателен: публичная ручка отвечает и без него, ключ
      # лишь поднимает лимит запросов.
      - TRON_USDT_WALLET_ADDRESS=${TRON_USDT_WALLET_ADDRESS:-}
      - TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      # TG-алерт при сбое любого источника (metrika/amo_leads/bank_*/...)
      # и fatal main. Дефолтно уходит в канал health-check бота
      # (см. services/portal-external-sync/alerts.py).
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
    volumes:
      - /var/log/portal-external-sync:/var/log/sync
    command: sh -c "mkdir -p /var/log/sync && exec python -u main.py 2>&1 | tee -a /var/log/sync/main.log"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  atmos-bot:
    image: ${DOCKER_USERNAME}/portal-atmos-bot:prod
    container_name: portal-atmos-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_ATMOS_BOT_TOKEN=${TELEGRAM_ATMOS_BOT_TOKEN}
      - TELEGRAM_ATMOS_TEAM_CHAT_ID=${TELEGRAM_ATMOS_TEAM_CHAT_ID}
      - ATMOS_ALLOWED_TG_USER_IDS=${ATMOS_ALLOWED_TG_USER_IDS}
      - OPENROUTER_ATMOS_API_KEY=${OPENROUTER_ATMOS_API_KEY}
      - ATMOS_WEBHOOK_PORT=${ATMOS_WEBHOOK_PORT:-8090}
      - ATMOS_WEBHOOK_URL=${ATMOS_WEBHOOK_URL}
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  changelog-bot:
    image: ${DOCKER_USERNAME}/portal-changelog-bot:prod
    container_name: portal-changelog-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - CHANGELOG_BOT_TOKEN=${CHANGELOG_BOT_TOKEN}
      - CHANGELOG_CHAT_ID=${CHANGELOG_CHAT_ID}
      - CHANGELOG_THREAD_ID=${CHANGELOG_THREAD_ID}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO:-wemdio/Portal}
      - REQUESTY_CHANGELOG_API_KEY=${REQUESTY_CHANGELOG_API_KEY}
      - CHANGELOG_OPENROUTER_MODEL=${CHANGELOG_OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - CHANGELOG_WEBHOOK_PORT=${CHANGELOG_WEBHOOK_PORT:-8095}
    ports:
      - "8095:8095"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: portal-telegram-bot-api
    healthcheck:
      # 127.0.0.1 вместо localhost: внутри контейнера localhost сначала пытается
      # IPv6 (::1), а telegram-bot-api слушает только IPv4 (0.0.0.0:8081) → refused.
      # Из-за этого healthcheck был вечно unhealthy при живом сервисе (23.07.2026).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portal-guacd
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  rdp-ws:
    image: ${DOCKER_USERNAME}/portal-rdp-ws:prod
    container_name: portal-rdp-ws
    depends_on:
      - guacd
    env_file:
      - .env
    environment:
      - RDP_WS_SECRET=${RDP_WS_SECRET}
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Watches every container with `autoheal=true` label and restarts it
  # whenever Docker's healthcheck flips it to `unhealthy`. Native Docker
  # restart policies don't react to health state — only to crashes —
  # so unhealthy-but-still-running workers (e.g. tg-outreach hung in
  # gramJS recvLoop) used to need manual intervention.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: portal-autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=180
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
          pids: 512
    restart: unless-stopped

  # Background BoB scorer — long-running daemon, 24/7 прогоняет домены из
  # base-of-bases через Mailganer и наполняет mailganer_domain_scores кэш.
  # При перезапуске продолжает с того же offset'а (см. background_scorer_state).
  # Управляется через /admin/auto-pipeline/scorer (toggle enabled flag в БД).
  worker-bob-scorer:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-bob-scorer
    command: ["node", "/app/workers/bobBackgroundScorer.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MAILGANER_ENDPOINT_URL=${MAILGANER_ENDPOINT_URL}
      - MAILGANER_API_KEY=${MAILGANER_API_KEY}
      - MAILGANER_AUTH_SCHEME=${MAILGANER_AUTH_SCHEME}
      - MAILGANER_SCORING_CONCURRENCY=${MAILGANER_SCORING_CONCURRENCY:-}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Manual scoring worker — обрабатывает client_manual_score_runs (CSV-загрузки
  # клиента на /client/manual-scoring). Polls pending runs, для каждого
  # прогоняет домены через Mailganer (с кэшем), обогащает email для score>1000,
  # выдаёт результаты разбитыми по 4 score-bucket'ам. Auto-cleanup runs старше
  # 30 дней при старте.
  worker-manual-scoring:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-manual-scoring
    command: ["node", "/app/workers/manualScoringWorker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MAILGANER_ENDPOINT_URL=${MAILGANER_ENDPOINT_URL}
      - MAILGANER_API_KEY=${MAILGANER_API_KEY}
      - MAILGANER_AUTH_SCHEME=${MAILGANER_AUTH_SCHEME}
      - MAILGANER_SCORING_CONCURRENCY=${MAILGANER_SCORING_CONCURRENCY:-}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "0.5"
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Авто-пайплайн (добор HH + база-баз → score-bucket → лиды в Instantly).
  # Вынесен из HTTP-крона в portal в отдельный демон, чтобы переживать редеплои:
  # на SIGTERM воркер перестаёт назначать новые домены, сохраняет завершённый
  # префикс (append + snapshots + seen), а остаток докатывается на следующем тике (resume через дедуп
  # seen_employers + идемпотентный createLeads). Расписание — внутри воркера
  # (окно parse_window_*_utc), отдельный cron не нужен. См. worker/autoPipeline.ts.
  # ВАЖНО: после деплоя отключить старый внешний крон на /api/cron/auto-hh-pipeline.
  worker-autopipeline:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-autopipeline
    command: ["node", "/app/workers/autoPipeline.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AUTOPIPELINE_TICK_MS=${AUTOPIPELINE_TICK_MS:-600000}
      - AUTOPIPELINE_MAX_ATTEMPTS=${AUTOPIPELINE_MAX_ATTEMPTS:-6}
      - MAILGANER_SCORING_CONCURRENCY=${MAILGANER_SCORING_CONCURRENCY:-}
    # Прогон идёт чанками по 500, но enrichment внутри чанка cooperative: после
    # SIGTERM новые домены не назначаются, уже начатые завершаются, готовый
    # префикс проходит append + snapshots + seen. 20 минут — аварийный предел.
    stop_grace_period: 20m
    deploy:
      resources:
        limits:
          # Один чанк (500 employers) в памяти: scrape-результаты + endpoint_raw
          # JSON + MX-кэш. Прежний OOM был из-за накопления ВСЕХ чанков; теперь
          # чанк-локально, но даём запас.
          memory: 3072M
          cpus: '1.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Auto-renew подписок ЮКассы. Раз в 5 минут (AUTORENEW_TICK_MS=300000)
  # дёргает runAutoRenewBatch — для каждого клиента с auto_renew=true и
  # paid_until в ближайшие 24ч списывает с привязанной карты через
  # POST /v3/payments. 5 мин — компромисс между прод (месячные подписки)
  # и тестовым сценарием (10-мин периоды): подписка просрочится максимум
  # на 5 мин до следующего тика. Подкрутить до часа: AUTORENEW_TICK_MS=3600000. Использует креды prod- или test-магазина в
  # зависимости от client_tariffs.is_test_shop у каждой подписки.
  # Идемпотентность по (tariff_id, YYYY-MM) — повторный тик в том же
  # месяце не дублирует списания.
  worker-autorenew:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-autorenew
    command: ["node", "/app/workers/autoRenewCron.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_TEST_SHOP_ID=${YOOKASSA_TEST_SHOP_ID:-}
      - YOOKASSA_TEST_SECRET_KEY=${YOOKASSA_TEST_SECRET_KEY:-}
      - YOOKASSA_FALLBACK_RECEIPT_EMAIL=${YOOKASSA_FALLBACK_RECEIPT_EMAIL:-}
      - AUTORENEW_TICK_MS=${AUTORENEW_TICK_MS:-300000}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

volumes:
  telegram-bot-api-data:

networks:
  portal-network:
    driver: bridge

