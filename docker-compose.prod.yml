      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=aicaller
      # Сколько кампаний обзвона идут одновременно. Значение не новое — это тот
      # же дефолт, что был зашит в коде; вписан сюда явно, чтобы менять его не
      # приходилось правкой воркера (соседний TG_OUTREACH_MAX_CONCURRENCY —
      # памятник тому, чем кончается зашитая константа).
      - AI_CALLER_MAX_CONCURRENCY=3
      # Обзвон переехал на единый жизненный цикл задач
      # (app/src/lib/jobs/lifecycle.ts): строка кампании арендуется, аренда
      # продлевается таймером каждые lease/3 = 60 с. 180 с ≈ три пропущенных
      # продления; после краха кампанию подберут через аренду (3 мин) + один
      # опрос соседа (30 с).
      - AI_CALLER_LEASE_SECONDS=180
      # Порог простоя по счётчику `called_contacts`. Здоровый цикл двигает его
      # раз в 2–3 минуты (звонок ≤ 120 с + пауза 5–15 с), но серия контактов, на
      # которых провайдер отвечает ошибкой, законно идёт ~10 с на контакт без
      # инкремента. 20 минут — выше такой серии и всё ещё вчетверо быстрее, чем
      # человек заметит замерший счётчик. Полный срок до перезапуска кампании
      # соседом: 20 мин порога + 3 мин аренды + 30 с опроса ≈ 23,5 минуты.
      - AI_CALLER_STALL_MS=1200000
    # Тридцать минут — потолок для РУЧНОЙ остановки; плановый деплой их не даёт
    # (`docker compose stop --timeout 15`, шаг 5 .semaphore/scheduled-deploy.yml).
    # Кампании держать больше нечего: цикл выходит по сигналу за секунды, а
    # незавершённый звонок сверяется с провайдером при следующем захвате.
    # Тридцати секунд хватает с запасом на shutdownGraceMs (8 с) плюс два
    # прохода освобождения аренды.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

