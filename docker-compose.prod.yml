      test: ["CMD-SHELL", "test -f /tmp/vertical-engine-v2-worker-heartbeat && test $$(( $$(date +%s) - $$(cat /tmp/vertical-engine-v2-worker-heartbeat | cut -c1-10) )) -lt 300 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-byo-send:
