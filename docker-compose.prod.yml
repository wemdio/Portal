# Лимиты memory+cpus — потолки; суммы ≤90-95 % от 32 vCPU / 64 GB RAM.
# Сервер: 2×Xeon E5-2670 (16C/32T) / 64 GB / 1 TB HDD SFF / HW RAID / 2×PSU.
# CPU: 29.65 / 32 = 93 %; RAM: 60 672 / 65 536 = 93 %. Остаток — ОС и Docker daemon.
services:
  portal:
    image: ${DOCKER_USERNAME}/portal:prod
    container_name: portal
    depends_on:
      - yandexmaps
      - telegram-bot-api
      - transcribe-worker
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/host.env
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - NODE_ENV=production
      - BODY_SIZE_LIMIT=600mb
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - INSTANTLY_DATABASE_URL=${INSTANTLY_DATABASE_URL}
      - INSTANTLY_SUPABASE_URL=${INSTANTLY_SUPABASE_URL}
      - INSTANTLY_SUPABASE_SERVICE_ROLE_KEY=${INSTANTLY_SUPABASE_SERVICE_ROLE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TG_TRANSCRIBE_BOT_TOKEN=${TG_TRANSCRIBE_BOT_TOKEN}
      - TG_LOCAL_API_URL=http://telegram-bot-api:8081
      - HH_PROXY_URL=${HH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AI_CALLER_PROVIDER=${AI_CALLER_PROVIDER:-vapi}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - OPENROUTER_VIDEO_TRANSCRIPT_API_KEY=${OPENROUTER_VIDEO_TRANSCRIPT_API_KEY}
      - OPENROUTER_SALES_COPILOT_API_KEY=${OPENROUTER_SALES_COPILOT_API_KEY}
      - AI_CALLER_TG_BOT_TOKEN=${AI_CALLER_TG_BOT_TOKEN}
      - TELEGRAM_ATMOS_BOT_TOKEN=${TELEGRAM_ATMOS_BOT_TOKEN}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-local}
      - TRANSCRIPTION_WORKER_URL=http://transcribe-worker:8070
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_BYPASS_TOKEN=${MAINTENANCE_BYPASS_TOKEN}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-8}
      - NODE_OPTIONS=--max-old-space-size=3072
      - TG_TARGET_API_ID=${TG_TARGET_API_ID}
      - TG_TARGET_API_HASH=${TG_TARGET_API_HASH}
      - TG_TARGET_SESSION=${TG_TARGET_SESSION}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 26624M
          cpus: '11'
    restart: unless-stopped
    networks:
      - portal-network

