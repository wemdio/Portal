version: '3.8'

services:
  portal:
    image: ${DOCKER_USERNAME}/portal:prod
    container_name: portal
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
    restart: unless-stopped
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
