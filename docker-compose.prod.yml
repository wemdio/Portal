# Лимиты memory — потолки; сумма ~14G под 16G RAM (запас ОС/Docker). cpus — потолок на контейнер.
services:
  portal:
    image: ${DOCKER_USERNAME}/portal:prod
    container_name: portal
    depends_on:
      - yandexmaps
      - telegram-bot-api
      - transcribe-worker
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/host.env
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - NODE_ENV=production
      - BODY_SIZE_LIMIT=600mb
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TG_TRANSCRIBE_BOT_TOKEN=${TG_TRANSCRIBE_BOT_TOKEN}
      - TG_LOCAL_API_URL=http://telegram-bot-api:8081
      - HH_PROXY_URL=${HH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AI_CALLER_PROVIDER=${AI_CALLER_PROVIDER:-vapi}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - OPENROUTER_VIDEO_TRANSCRIPT_API_KEY=${OPENROUTER_VIDEO_TRANSCRIPT_API_KEY}
      - OPENROUTER_SALES_COPILOT_API_KEY=${OPENROUTER_SALES_COPILOT_API_KEY}
      - AI_CALLER_TG_BOT_TOKEN=${AI_CALLER_TG_BOT_TOKEN}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-local}
      - TRANSCRIPTION_WORKER_URL=http://transcribe-worker:8070
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_BYPASS_TOKEN=${MAINTENANCE_BYPASS_TOKEN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6144M
          cpus: '4'
    restart: unless-stopped
    networks:
      - portal-network

  worker-hh:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-hh
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
      - WORKER_KIND=hh
    stop_grace_period: 3h
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - portal-network

  worker-search:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-search
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - PROXY_URLS=${PROXY_URLS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
      - WORKER_KIND=search
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - portal-network

  worker-enrich:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-enrich
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
      - WORKER_KIND=enrich
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-yandexmaps:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-yandexmaps
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
      - WORKER_KIND=yandexmaps
    depends_on:
      - yandexmaps
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-emailvalidation:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-emailvalidation
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
      - WORKER_KIND=emailvalidation
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-tg-outreach:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-tg-outreach
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_TG_OUTREACH_API_KEY=${OPENROUTER_TG_OUTREACH_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=tgoutreach
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-aicaller:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-aicaller
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AI_CALLER_PROVIDER=${AI_CALLER_PROVIDER:-vapi}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=aicaller
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  worker-sales-copilot:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-sales-copilot
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_SALES_COPILOT_API_KEY=${OPENROUTER_SALES_COPILOT_API_KEY}
      - OPENROUTER_TG_OUTREACH_API_KEY=${OPENROUTER_TG_OUTREACH_API_KEY}
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=salescopilot
    stop_grace_period: 5m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - portal-network

  transcribe-worker:
    image: ${DOCKER_USERNAME}/portal-transcribe-worker:prod
    container_name: portal-transcribe-worker
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-}
      - MAX_CONCURRENT=${TRANSCRIBE_MAX_CONCURRENT:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - portal-network

  yandexmaps:
    image: ${DOCKER_USERNAME}/portal-yandexmaps:prod
    container_name: portal-yandexmaps
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    restart: unless-stopped
    ports:
      - "8010:8000"
    networks:
      - portal-network

  health-check:
    image: ${DOCKER_USERNAME}/portal-health-check:prod
    container_name: portal-health-check
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
      - HEALTH_PORTAL_URL=${HEALTH_PORTAL_URL:-https://polza-portal.ru}
      - HEALTH_SERVER_IP=${HEALTH_SERVER_IP:-144.31.54.166}
      - PROXY_URLS=${PROXY_URLS}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
    # Резолв публичного хоста в IP хоста, чтобы проверять именно https://polza-portal.ru с того же сервера
    extra_hosts:
      - "polza-portal.ru:host-gateway"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - portal-network

  atmos-bot:
    image: ${DOCKER_USERNAME}/portal-atmos-bot:prod
    container_name: portal-atmos-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_ATMOS_BOT_TOKEN=${TELEGRAM_ATMOS_BOT_TOKEN}
      - TELEGRAM_ATMOS_TEAM_CHAT_ID=${TELEGRAM_ATMOS_TEAM_CHAT_ID}
      - ATMOS_ALLOWED_TG_USER_IDS=${ATMOS_ALLOWED_TG_USER_IDS}
      - OPENROUTER_ATMOS_API_KEY=${OPENROUTER_ATMOS_API_KEY}
      - ATMOS_WEBHOOK_PORT=${ATMOS_WEBHOOK_PORT:-8090}
      - ATMOS_WEBHOOK_URL=${ATMOS_WEBHOOK_URL}
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - portal-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: portal-telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portal-guacd
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  rdp-ws:
    image: ${DOCKER_USERNAME}/portal-rdp-ws:prod
    container_name: portal-rdp-ws
    depends_on:
      - guacd
    env_file:
      - .env
    environment:
      - RDP_WS_SECRET=${RDP_WS_SECRET}
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - portal-network

volumes:
  telegram-bot-api-data:

networks:
  portal-network:
    driver: bridge
