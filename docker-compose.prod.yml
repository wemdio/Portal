  # ─── polza-reports — TEMPORARILY DISABLED ───
  # Image ${DOCKER_USERNAME}/portal-polza-reports:prod is missing from Docker
  # Hub registry, which blocks every prod deploy on `docker compose pull`. Service
  # was added in d271201a feat(polza-reports) but the CI/CD push pipeline for it
  # was never wired up. Re-enable after the image is built and pushed:
  #   cd services/polza-reports && docker build -t dimakuladmed/portal-polza-reports:prod . && docker push dimakuladmed/portal-polza-reports:prod
  # While disabled, portal-side Coldy/Trigga report endpoints return network errors
  # (handled as soft-fails — the rest of the portal stays up).
  #
  # polza-reports:
  #   image: ${DOCKER_USERNAME}/portal-polza-reports:prod
  #   container_name: portal-polza-reports
  #   # Stateless Coldy scraper + Trigga CSV → xlsx. Reached only from the portal
  #   # service inside portal-network; no port exposed publicly.
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2048M
  #         cpus: '1.5'
  #   restart: unless-stopped
  #   networks:
  #     - portal-network

  health-check:
    image: ${DOCKER_USERNAME}/portal-health-check:prod
    container_name: portal-health-check
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
      - HEALTH_PORTAL_URL=${HEALTH_PORTAL_URL:-https://polza-portal.ru}
      - HEALTH_SERVER_IP=${HEALTH_SERVER_IP:-139.60.162.12}
      - PROXY_URLS=${PROXY_URLS}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - HEALTH_DISK_TOTAL_GB=${HEALTH_DISK_TOTAL_GB:-20}
      - HEALTH_DISK_WARN_GB=${HEALTH_DISK_WARN_GB:-18}
    # Резолв публичного хоста в IP хоста, чтобы проверять именно https://polza-portal.ru с того же сервера
    extra_hosts:
      - "polza-portal.ru:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    restart: unless-stopped
    networks:
      - portal-network

  instantly-sync-bot:
    image: ${DOCKER_USERNAME}/portal-instantly-sync-bot:prod
    container_name: portal-instantly-sync-bot
    env_file:
      - .env
    environment:
      - POLZA_INSTANTLY_SYNC_BOT_API_KEY=${POLZA_INSTANTLY_SYNC_BOT_API_KEY}
      - INSTANTLY_API_KEY=${INSTANTLY_API_KEY}
      - INSTANTLY_PORTAL_API_KEY=${INSTANTLY_PORTAL_API_KEY}
      - INSTANTLY_DATABASE_URL=${INSTANTLY_DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - INSTANTLY_SYNC_BOT_CHAT_ID=${INSTANTLY_SYNC_BOT_CHAT_ID}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID}
      - INSTANTLY_LEADS_CONCURRENCY=${INSTANTLY_LEADS_CONCURRENCY:-2}
      - INSTANTLY_LEADS_INTER_PAGE_DELAY_SEC=${INSTANTLY_LEADS_INTER_PAGE_DELAY_SEC:-0.5}
      - INSTANTLY_LEADS_PAGE_LIMIT=${INSTANTLY_LEADS_PAGE_LIMIT:-100}
      - INSTANTLY_LEADS_HTTP_TIMEOUT_SEC=${INSTANTLY_LEADS_HTTP_TIMEOUT_SEC:-120}
      - INSTANTLY_LEADS_RPS_LIMIT=${INSTANTLY_LEADS_RPS_LIMIT:-3.0}
      - INSTANTLY_SYNC_INTERVAL_SEC=${INSTANTLY_SYNC_INTERVAL_SEC}
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  # pg_dump-бэкапы обеих БД (main + Instantly) → S3 / Supabase Storage.
  # Cron внутри контейнера; см. services/backup/crontab.
  portal-backup:
    image: ${DOCKER_USERNAME}/portal-backup:prod
    container_name: portal-backup
    env_file:
      - .env
    environment:
      - MAIN_SUPABASE_DATABASE_URL=${MAIN_SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}
      - INSTANTLY_DATABASE_URL=${INSTANTLY_DATABASE_URL:-}
      - INSTANTLY_DEV_DATABASE_URL=${INSTANTLY_DEV_DATABASE_URL:-}
      # S3 storage (primary): TWC S3 или любой S3-совместимый.
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-${MAIN_S3_ENDPOINT:-}}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-${MAIN_S3_BUCKET:-}}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-${MAIN_S3_ACCESS_KEY_ID:-}}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-${MAIN_S3_SECRET_ACCESS_KEY:-}}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-${MAIN_S3_REGION:-ru-1}}
      # Supabase Storage (fallback, если S3 не задан).
      - BACKUP_SUPABASE_URL=${BACKUP_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}
      - BACKUP_SUPABASE_KEY=${BACKUP_SUPABASE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      - BACKUP_BUCKET=${BACKUP_BUCKET:-db-backups}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_REMOTE_RETENTION_DAYS=${BACKUP_REMOTE_RETENTION_DAYS:-7}
      - TELEGRAM_HEALTH_BOT_TOKEN=${TELEGRAM_HEALTH_BOT_TOKEN:-}
      - TELEGRAM_HEALTH_CHAT_ID=${TELEGRAM_HEALTH_CHAT_ID:-}
    volumes:
      - portal-backup-data:/backups
    deploy:
      resources:
        limits:
          # 1 ГБ + 1 CPU нужны pg_dump для главной Supabase БД (несколько ГБ
          # данных, --compress=6 жмёт в один поток). Прежний лимит 256M убивал
          # curl OOM-ом при стриминге (даже после перехода на -T --upload-file
          # хочется иметь запас на pg_dump + tr/sed/find в cleanup_remote).
          # См. services/backup/backup.sh комментарий про curl/curl#18300.
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - portal-network

  atmos-bot:
    image: ${DOCKER_USERNAME}/portal-atmos-bot:prod
    container_name: portal-atmos-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_ATMOS_BOT_TOKEN=${TELEGRAM_ATMOS_BOT_TOKEN}
      - TELEGRAM_ATMOS_TEAM_CHAT_ID=${TELEGRAM_ATMOS_TEAM_CHAT_ID}
      - ATMOS_ALLOWED_TG_USER_IDS=${ATMOS_ALLOWED_TG_USER_IDS}
      - OPENROUTER_ATMOS_API_KEY=${OPENROUTER_ATMOS_API_KEY}
      - ATMOS_WEBHOOK_PORT=${ATMOS_WEBHOOK_PORT:-8090}
      - ATMOS_WEBHOOK_URL=${ATMOS_WEBHOOK_URL}
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    restart: unless-stopped
    networks:
      - portal-network

  changelog-bot:
    image: ${DOCKER_USERNAME}/portal-changelog-bot:prod
    container_name: portal-changelog-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - CHANGELOG_BOT_TOKEN=${CHANGELOG_BOT_TOKEN}
      - CHANGELOG_CHAT_ID=${CHANGELOG_CHAT_ID}
      - CHANGELOG_THREAD_ID=${CHANGELOG_THREAD_ID}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO:-wemdio/Portal}
      - REQUESTY_CHANGELOG_API_KEY=${REQUESTY_CHANGELOG_API_KEY}
      - CHANGELOG_OPENROUTER_MODEL=${CHANGELOG_OPENROUTER_MODEL:-anthropic/claude-sonnet-4-5}
      - CHANGELOG_WEBHOOK_PORT=${CHANGELOG_WEBHOOK_PORT:-8095}
    ports:
      - "8095:8095"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    restart: unless-stopped
    networks:
      - portal-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: portal-telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portal-guacd
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  rdp-ws:
    image: ${DOCKER_USERNAME}/portal-rdp-ws:prod
    container_name: portal-rdp-ws
    depends_on:
      - guacd
    env_file:
      - .env
    environment:
      - RDP_WS_SECRET=${RDP_WS_SECRET}
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    restart: unless-stopped
    networks:
      - portal-network

  # Watches every container with `autoheal=true` label and restarts it
  # whenever Docker's healthcheck flips it to `unhealthy`. Native Docker
  # restart policies don't react to health state — only to crashes —
  # so unhealthy-but-still-running workers (e.g. tg-outreach hung in
  # gramJS recvLoop) used to need manual intervention.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: portal-autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=180
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

volumes:
  telegram-bot-api-data:
  portal-backup-data:

networks:
  portal-network:
    driver: bridge

