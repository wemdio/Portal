      - LEAD_ALERTS_TELEGRAM_CHAT_ID=${LEAD_ALERTS_TELEGRAM_CHAT_ID:-}
      - LEAD_ALERTS_TELEGRAM_THREAD_ID=${LEAD_ALERTS_TELEGRAM_THREAD_ID:-}
      - LEAD_HANDOFF_ENABLED=${LEAD_HANDOFF_ENABLED:-false}
      - LEAD_HANDOFF_MODEL=${LEAD_HANDOFF_MODEL:-}
      - WORKER_POLL_INTERVAL_MS=30000
      - WORKER_KIND=instantlyleads
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - portal-network

  transcribe-worker:
    image: ${DOCKER_USERNAME}/portal-transcribe-worker:prod
    container_name: portal-transcribe-worker
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-}
      # 4 parallel jobs on 6 cores. Worker auto-splits cpu_threads = cores /
      # MAX_CONCURRENT (= 1 thread/job here) and passes num_workers=4 into
      # faster-whisper so ctranslate2 doesn't internally serialize. Bumping
      # to 4 turned the queue from "1 job at a time" → "4 in flight" — see
      # 29.06 incident, audio-transcribe UI was stuck on "Подготовка файла…"
      # for hours because all earlier jobs were waiting on the semaphore.
      - MAX_CONCURRENT=${TRANSCRIBE_MAX_CONCURRENT:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
