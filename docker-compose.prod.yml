version: '3.8'

services:
  portal:
    image: ${DOCKER_USERNAME}/portal:prod
    container_name: portal
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
