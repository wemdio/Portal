version: '3.8'

services:
  portal:
    image: ${DOCKER_USERNAME}/portal:prod
    container_name: portal
    depends_on:
      - yandexmaps
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - SEARCH_PROXY_URLS=${SEARCH_PROXY_URLS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - AI_CALLER_TG_BOT_TOKEN=${AI_CALLER_TG_BOT_TOKEN}
    restart: unless-stopped
    networks:
      - portal-network

  worker:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HH_PROXY_URL=${HH_PROXY_URL}
      - SEARCH_PROXY_URLS=${SEARCH_PROXY_URLS}
      - HH_REQUEST_INTERVAL_MS=${HH_REQUEST_INTERVAL_MS}
      - HH_MAX_RETRIES=${HH_MAX_RETRIES}
      - OPENROUTER_PERSONALIZATION_API_KEY=${OPENROUTER_PERSONALIZATION_API_KEY}
      - YANDEXMAPS_SERVICE_URL=http://yandexmaps:8000
      - YANDEXMAPS_PROXY_ENCRYPTION_KEY=${YANDEXMAPS_PROXY_ENCRYPTION_KEY}
      - WORKER_POLL_INTERVAL_MS=3000
      - WORKER_DRAIN_TIMEOUT_MINUTES=${WORKER_DRAIN_TIMEOUT_MINUTES:-15}
    depends_on:
      - yandexmaps
    stop_grace_period: 4h
    restart: unless-stopped
    networks:
      - portal-network

  yandexmaps:
    image: ${DOCKER_USERNAME}/portal-yandexmaps:prod
    container_name: portal-yandexmaps
    restart: unless-stopped
    ports:
      - "8010:8000"
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
