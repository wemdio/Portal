          memory: 256M
          cpus: '0.1'
    restart: unless-stopped
    networks:
      - portal-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: portal-telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portal-guacd
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - portal-network

  rdp-ws:
    image: ${DOCKER_USERNAME}/portal-rdp-ws:prod
    container_name: portal-rdp-ws
    depends_on:
      - guacd
    env_file:
      - .env
    environment:
      - RDP_WS_SECRET=${RDP_WS_SECRET}
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    restart: unless-stopped
    networks:
      - portal-network

  # Watches every container with `autoheal=true` label and restarts it
  # whenever Docker's healthcheck flips it to `unhealthy`. Native Docker
  # restart policies don't react to health state — only to crashes —
  # so unhealthy-but-still-running workers (e.g. tg-outreach hung in
  # gramJS recvLoop) used to need manual intervention.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: portal-autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=180
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  # Background BoB scorer — long-running daemon, 24/7 прогоняет домены из
  # base-of-bases через Mailganer и наполняет mailganer_domain_scores кэш.
  # При перезапуске продолжает с того же offset'а (см. background_scorer_state).
  # Управляется через /admin/auto-pipeline/scorer (toggle enabled flag в БД).
  worker-bob-scorer:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-bob-scorer
    command: ["node", "/app/workers/bobBackgroundScorer.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MAILGANER_ENDPOINT_URL=${MAILGANER_ENDPOINT_URL}
      - MAILGANER_API_KEY=${MAILGANER_API_KEY}
      - MAILGANER_AUTH_SCHEME=${MAILGANER_AUTH_SCHEME}
      - MAILGANER_SCORING_CONCURRENCY=${MAILGANER_SCORING_CONCURRENCY:-}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - portal-network

  # Manual scoring worker — обрабатывает client_manual_score_runs (CSV-загрузки
  # клиента на /client/manual-scoring). Polls pending runs, для каждого
  # прогоняет домены через Mailganer (с кэшем), обогащает email для score>1000,
  # выдаёт результаты разбитыми по 4 score-bucket'ам. Auto-cleanup runs старше
  # 30 дней при старте.
  worker-manual-scoring:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-manual-scoring
    command: ["node", "/app/workers/manualScoringWorker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MAILGANER_ENDPOINT_URL=${MAILGANER_ENDPOINT_URL}
      - MAILGANER_API_KEY=${MAILGANER_API_KEY}
      - MAILGANER_AUTH_SCHEME=${MAILGANER_AUTH_SCHEME}
      - MAILGANER_SCORING_CONCURRENCY=${MAILGANER_SCORING_CONCURRENCY:-}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - portal-network

  # Авто-пайплайн (добор HH + база-баз → score-bucket → лиды в Instantly).
  # Вынесен из HTTP-крона в portal в отдельный демон, чтобы переживать редеплои:
  # на SIGTERM прогон останавливается между чанками (текущий чанк закоммичен:
  # append + seen), а остаток докатывается на следующем тике (resume через дедуп
  # seen_employers + идемпотентный createLeads). Расписание — внутри воркера
  # (окно parse_window_*_utc), отдельный cron не нужен. См. worker/autoPipeline.ts.
  # ВАЖНО: после деплоя отключить старый внешний крон на /api/cron/auto-hh-pipeline.
  worker-autopipeline:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-autopipeline
    command: ["node", "/app/workers/autoPipeline.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AUTOPIPELINE_TICK_MS=${AUTOPIPELINE_TICK_MS:-600000}
      - AUTOPIPELINE_MAX_ATTEMPTS=${AUTOPIPELINE_MAX_ATTEMPTS:-6}
      - MAILGANER_SCORING_CONCURRENCY=${MAILGANER_SCORING_CONCURRENCY:-}
    # Прогон идёт чанками по 500. На SIGTERM (редеплой) даём текущему чанку
    # доделать enrichment + append + seen, затем воркер останавливается
    # (interrupted → resume на след. тике). 20 мин — с запасом на один чанк.
    stop_grace_period: 20m
    deploy:
      resources:
        limits:
          # Один чанк (500 employers) в памяти: scrape-результаты + endpoint_raw
          # JSON + MX-кэш. Прежний OOM был из-за накопления ВСЕХ чанков; теперь
          # чанк-локально, но даём запас.
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped
    networks:
      - portal-network

  # Auto-renew подписок ЮКассы. Раз в 5 минут (AUTORENEW_TICK_MS=300000)
  # дёргает runAutoRenewBatch — для каждого клиента с auto_renew=true и
  # paid_until в ближайшие 24ч списывает с привязанной карты через
  # POST /v3/payments. 5 мин — компромисс между прод (месячные подписки)
  # и тестовым сценарием (10-мин периоды): подписка просрочится максимум
  # на 5 мин до следующего тика. Подкрутить до часа: AUTORENEW_TICK_MS=3600000. Использует креды prod- или test-магазина в
  # зависимости от client_tariffs.is_test_shop у каждой подписки.
  # Идемпотентность по (tariff_id, YYYY-MM) — повторный тик в том же
  # месяце не дублирует списания.
  worker-autorenew:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-autorenew
    command: ["node", "/app/workers/autoRenewCron.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_TEST_SHOP_ID=${YOOKASSA_TEST_SHOP_ID:-}
      - YOOKASSA_TEST_SECRET_KEY=${YOOKASSA_TEST_SECRET_KEY:-}
      - YOOKASSA_FALLBACK_RECEIPT_EMAIL=${YOOKASSA_FALLBACK_RECEIPT_EMAIL:-}
      - AUTORENEW_TICK_MS=${AUTORENEW_TICK_MS:-300000}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    restart: unless-stopped
    networks:
      - portal-network

  # OpenOutreach LinkedIn outreach runtime (см.
  # docs/superpowers/specs/2026-06-10-openoutreach-portal-native-design.md).
  # Один Django-контейнер обслуживает 5-20 LinkedIn-аккаунтов через
  # async main loop + ephemeral Chromium per task (cap=3 одновременных).
  # Polls li2_accounts.status=='running' каждые 5s, выполняет li2_tasks
  # внутри campaign.working_hours окон. Cookies/storage_state в Postgres,
  # контейнер stateless.
  #
  # VNC :6080 (внутри сети) для прохождения CAPTCHA — оператор открывает
  # https://polza-portal.ru/openoutreach-vnc/ (basic auth через nginx),
  # проходит проверку руками, шлёт POST /tools/li-outreach-v2/accounts/
  # resume-from-captcha — daemon продолжит.
  openoutreach:
    image: ${DOCKER_USERNAME}/portal-openoutreach:prod
    container_name: portal-openoutreach
    build:
      context: ./services/openoutreach
      dockerfile: compose/linkedin/Dockerfile
      args:
        BUILD_ENV: production
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=linkedin.django_settings
      # SUPABASE_DB_URL — наш self-hosted Postgres на 144.31.54.166. Django
      # читает его как DATABASE_URL (см. linkedin/django_settings.py).
      - DATABASE_URL=${SUPABASE_DB_URL}
      # OpenOutreach LLM key — общий для всех аккаунтов, как в start/route.ts.
      - OPENROUTER_LI_OUTREACH_API_KEY=${OPENROUTER_LI_OUTREACH_API_KEY}
      # Daemon tuning
      - LI2_DAEMON_POLL_INTERVAL_SEC=${LI2_DAEMON_POLL_INTERVAL_SEC:-5}
      - LI2_MAX_CONCURRENT_BROWSERS=${LI2_MAX_CONCURRENT_BROWSERS:-3}
      - ENABLE_VNC=true
      # headless по умолчанию. Для прохождения CAPTCHA через VNC оператор
      # ставит LI2_BROWSER_HEADLESS=false в .env — Chromium рисует на Xvfb :99
      # (его шарит x11vnc). ВНИМАНИЕ: keep-alive паузы на checkpoint пока нет —
      # см. docs/captcha-vnc-plan.md.
      - LI2_BROWSER_HEADLESS=${LI2_BROWSER_HEADLESS:-true}
    # noVNC слушает :6080 внутри контейнера. Публикуем ТОЛЬКО на 127.0.0.1 —
    # наружу проксирует nginx с basic-auth (см. docs/captcha-vnc-plan.md).
    ports:
      - "127.0.0.1:6080:6080"
    labels:
      - autoheal=true
    healthcheck:
      # daemon пишет /tmp/li2-daemon-heartbeat на каждой итерации main_loop'a
      # (~ каждые 5s). 300s threshold — даём запас на startup'ы task'ов
      # (Playwright cold start, LLM-вызовы) которые могут на минуту-другую
      # затянуть итерацию.
      test: ["CMD-SHELL", "test -f /tmp/li2-daemon-heartbeat && test $$(( $$(date +%s) - $$(cat /tmp/li2-daemon-heartbeat | cut -c1-10) )) -lt 300 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s
    # Грейс-период должен дать текущим в полёте Chromium'ам корректно закрыться
    # и сохранить storage_state. Task'и идут 30-180s, дадим 5 минут с запасом.
    stop_grace_period: 5m
    deploy:
      resources:
        limits:
          # 500 MB Django + ML (FastEmbed model в RAM ~ 300 MB) + 3 × ~500 MB
          # peak Chromium на LinkedIn-heavy страницах + headroom для bursts.
          memory: 2560M
          cpus: '1.5'
    restart: unless-stopped
    networks:
      - portal-network

volumes:
  telegram-bot-api-data:
  portal-backup-data:

networks:
  portal-network:
    driver: bridge

