      - INSTANTLY_SUPABASE_SERVICE_ROLE_KEY=${INSTANTLY_SUPABASE_SERVICE_ROLE_KEY}
      - INSTANTLY_API_KEY=${INSTANTLY_API_KEY}
      - INSTANTLY_PORTAL_API_KEY=${INSTANTLY_PORTAL_API_KEY}
      - OPENROUTER_INSTANTLY_LEAD_API_KEY=${OPENROUTER_INSTANTLY_LEAD_API_KEY}
