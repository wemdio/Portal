  # РОВНО ОДНА РЕПЛИКА И ОДИН container_name — это инвариант, а не оформление.
  # Воркер держит живое MTProto-соединение sales-chat-аккаунтами; два процесса
  # на одном Telegram-аккаунте дают AUTH_KEY_DUPLICATED и сжигают сессию (та же
  # причина, что у worker-tg-parser; см. lib/tgParser/accountConflict.ts).
  # Именованный контейнер гарантирует последовательный recreate: новый не
  # поднимется, пока старый не отпустил имя. Отсюда же concurrency=1 в самом
  # воркере (app/worker/salesChatLogger.ts).
  worker-sales-chat-logger:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-sales-chat-logger
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - SALES_CHAT_CIPHER_KEY=${SALES_CHAT_CIPHER_KEY}
      - MAIN_S3_ENDPOINT=${MAIN_S3_ENDPOINT}
      - MAIN_S3_REGION=${MAIN_S3_REGION:-ru-1}
      - MAIN_S3_BUCKET=${MAIN_S3_BUCKET}
      - MAIN_S3_ACCESS_KEY_ID=${MAIN_S3_ACCESS_KEY_ID}
      - MAIN_S3_SECRET_ACCESS_KEY=${MAIN_S3_SECRET_ACCESS_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - SALES_CHAT_LEASE_SECONDS=${SALES_CHAT_LEASE_SECONDS:-180}
      - WORKER_KIND=saleschatlogger
    # 30 с вместо прежних 5 минут: воркер на едином жизненном цикле по SIGTERM
    # отпускает аренду за пару секунд, а синк продолжается с курсора по
    # аккаунтам в следующем захвате. Ждать конца текущего аккаунта незачем —
    # он идёт минутами-часами и в любой grace всё равно не уложится.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Воркер архивации диалогов sales-chat-аккаунта в ZIP (1 диалог = 1 DOCX).
  # Запускается по pending-задачам в sales_chat_archive_jobs (UI кладёт их,
  # когда РОП/менеджер жмёт «Скачать архив» в Анализаторе сейлз-переписок).
  # Telegram-сессии не нужны — читает только нашу БД и льёт ZIP в MAIN S3
  # multipart-стримом, так что env-переменных меньше, чем у logger'а.
  worker-sales-chat-archive:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-sales-chat-archive
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MAIN_S3_ENDPOINT=${MAIN_S3_ENDPOINT}
      - MAIN_S3_REGION=${MAIN_S3_REGION:-ru-1}
      - MAIN_S3_BUCKET=${MAIN_S3_BUCKET}
      - MAIN_S3_ACCESS_KEY_ID=${MAIN_S3_ACCESS_KEY_ID}
      - MAIN_S3_SECRET_ACCESS_KEY=${MAIN_S3_SECRET_ACCESS_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=saleschatarchive
    # Жоб может крутиться 10-20 минут на 1000+ диалогов аккаунта. SIGTERM
    # на деплое прервёт текущую сборку — startupRecovery вернёт её в pending
    # при следующем старте, воркер пересоберёт с нуля.
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          # 1 GB даёт запас на один DOCX в RAM (до ~50 MB на крупный диалог)
          # + буферы archiver и lib-storage (5 MB × 4 in-flight multipart).
          memory: 1024M
          cpus: '0.5'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  # Large report exports use PostgreSQL COPY -> gzip -> private S3 without
  # buffering the CSV in application memory. A dedicated single replica keeps
  # million-row exports away from interactive and enrichment worker queues.
  worker-client-report-exports:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-client-report-exports
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - MAIN_S3_ENDPOINT=${MAIN_S3_ENDPOINT}
      - MAIN_S3_REGION=${MAIN_S3_REGION:-ru-1}
      - MAIN_S3_BUCKET=${MAIN_S3_BUCKET}
      - MAIN_S3_ACCESS_KEY_ID=${MAIN_S3_ACCESS_KEY_ID}
      - MAIN_S3_SECRET_ACCESS_KEY=${MAIN_S3_SECRET_ACCESS_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=clientreportexports
    # A long COPY finishes gracefully during a rolling deploy. Memory remains
    # bounded to stream buffers and S3 multipart parts.
    # Внимание: scheduled deploy обрезает это до 15 секунд (шаг 5
    # .semaphore/scheduled-deploy.yml), grace целиком отрабатывает только при
    # ручном `docker compose stop`.
    stop_grace_period: 2h
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.35'
          pids: 128
    restart: unless-stopped
    networks:
      - portal-network

  # РОВНО ОДНА РЕПЛИКА. Не масштабировать, не поднимать второй такой контейнер
  # и не запускать этот воркер локально против прод-БД.
  # Задача парсера держит открытую сессию Telegram. Сосед, забравший задачу
  # (после деплоя или по истечении аренды), подключится ТЕМ ЖЕ аккаунтом, и
  # Telegram за доли секунды ответит AUTH_KEY_DUPLICATED: падают оба обхода, а
  # на повторах сессия сгорает и требует переавторизации (app/src/lib/tgParser/
  # accountConflict.ts). Проверка конфликта смотрит только в
  # tg_outreach_campaigns и второй процесс парсера увидеть не может.
  # Единственность держится этим container_name и последовательным деплоем.
  #
  # stop_grace_period 30 с (было 30 мин): доигрывать обход в останавливаемом
  # контейнере больше не нужно — задача возобновляется с чекпойнта, а аренда
  # отпускается за секунды (app/worker/tgParser.ts). Тридцати секунд хватает на
  # два прохода освобождения аренды с контрольным чтением (~3 с) и на
  # shutdownGraceMs=12 с ожидания тела. Эти 12 с — попытка доиграть, а не
  # гарантия: обход может не успеть свернуться, и client.disconnect() тогда не
  # выполнится до SIGKILL. От наложения сессий защищает не он, а описанная
  # выше топология — единственный container_name и последовательный recreate;
  # на SIGKILL сокет закрывает ядро. Прежние 30 минут ровно на столько и
  # растягивали каждый деплой, заставший работающий обход.
  worker-tg-parser:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-tg-parser
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TG_LOCAL_API_URL=http://telegram-bot-api:8081
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=tgparser
      - TG_TARGET_API_ID=${TG_TARGET_API_ID}
      - TG_TARGET_API_HASH=${TG_TARGET_API_HASH}
      - TG_TARGET_SESSION=${TG_TARGET_SESSION}
    depends_on:
      - telegram-bot-api
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '2'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  worker-tg-transcribe:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-tg-transcribe
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TG_TRANSCRIBE_BOT_TOKEN=${TG_TRANSCRIBE_BOT_TOKEN}
      - TG_LOCAL_API_URL=http://telegram-bot-api:8081
      - TG_TARGET_API_ID=${TG_TARGET_API_ID}
      - TG_TARGET_API_HASH=${TG_TARGET_API_HASH}
      - TG_TARGET_SESSION=${TG_TARGET_SESSION}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - TG_TRANSCRIBE_WORKER_MAX_CONCURRENCY=${TG_TRANSCRIBE_WORKER_MAX_CONCURRENCY:-5}
      - WORKER_KIND=tgtranscribe
    depends_on:
      - telegram-bot-api
      - transcribe-worker
    stop_grace_period: 30m
    deploy:
      resources:
        limits:
          # 23.07.2026: воркер достигал прежнего лимита 2 GiB при обработке
          # нескольких видео параллельно. Лимит не резервирует память заранее.
          memory: 8192M
