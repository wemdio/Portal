      - MAIN_S3_REGION=${MAIN_S3_REGION:-ru-1}
      - MAIN_S3_BUCKET=${MAIN_S3_BUCKET}
      - MAIN_S3_ACCESS_KEY_ID=${MAIN_S3_ACCESS_KEY_ID}
      - MAIN_S3_SECRET_ACCESS_KEY=${MAIN_S3_SECRET_ACCESS_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=saleschatarchive
