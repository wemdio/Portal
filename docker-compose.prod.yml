  worker-tg-outreach:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-tg-outreach
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_TG_OUTREACH_API_KEY=${OPENROUTER_TG_OUTREACH_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=tgoutreach
      # Сколько БОЕВЫХ кампаний воркер ведёт одновременно. Значение зашито, а
      # не взято из .env: прошлый подъём 5 → 10 задумывался, но переменную на
      # сервер так и не завезли, и воркер продолжал работать с дефолтом 5 из
      # кода. Из-за этого 04.08.2026 прогрев ATOL-1 два часа висел в pending —
      # слот занимали пять боевых кампаний, а прогрев брал слот из того же пула.
      # С переездом прогрева на аренду этот пул только боевой: у прогрева своя
      # очередь и свой предел (TG_WARMUP_MAX_CONCURRENCY ниже), и потолок
      # одновременных наборов клиентов теперь — СУММА двух чисел.
      - TG_OUTREACH_MAX_CONCURRENCY=12
      # Сторож: сколько молчания кампании считать зависанием. Дефолт из кода —
      # 15 мин, и этого мало: штатная анти-флуд пауза между аккаунтами доходит
      # до 599с (10 мин), то есть запас всего ~5 мин. 16.08.2026 сторож трижды
      # за 8.5 часов ронял процесс, унося все 5 кампаний разом.
      - TG_OUTREACH_WATCHDOG_MS=1500000
      # Сколько ждать после разрыва сокетов, прежде чем ронять весь процесс.
      # Дефолт 3 мин не сработал ни разу из трёх 16.08.2026 — цикл не успевал
      # размотаться, и мягкая ступень «гасим одну кампанию» каждый раз
      # эскалировала в process.exit(1). Даём циклу реальное время умереть.
      - TG_OUTREACH_WATCHDOG_GRACE_MS=600000
      # Прогрев переехал на единый жизненный цикл задач
      # (app/src/lib/jobs/lifecycle.ts): строка прогона арендуется, аренда
      # продлевается таймером каждые lease/3 = 60 с. 180 с ≈ три пропущенных
      # продления; после краха прогон подберут через аренду (3 мин) + один
      # опрос соседа (30 с). Порога простоя у этой очереди нет намеренно —
      # арифметика в комментарии к warmupRunner в app/worker/tgOutreach.ts
      # (законная ночная пауза прогрева — 8 часов, ниже неё порог не поставить).
      - TG_WARMUP_LEASE_SECONDS=180
      # Сколько прогревов идут одновременно. Прибавляется к боевым кампаниям
      # выше, а не делит с ними пул, поэтому смотреть надо на сумму: память
      # контейнера считалась по числу одновременных наборов клиентов gramJS.
      # Два — чтобы вторая партия аккаунтов не ждала четверо суток и при этом
      # прибавка к пику была шестой частью от боевой нагрузки.
      - TG_WARMUP_MAX_CONCURRENCY=2
    # stop_grace_period НЕ трогаем: в этом же контейнере ещё живут боевые
    # кампании аутрича, не переведённые на аренду, и им нужен запас, чтобы
    # доиграть круг. Срок переезжает вместе с ними, в задаче 4 этапа.
    #
    # Тридцать минут — потолок для РУЧНОЙ остановки (`docker compose stop` без
    # --timeout) и только. Плановый деплой их не даёт: он останавливает воркеры
    # `docker compose stop --timeout 15` (шаг 5 .semaphore/scheduled-deploy.yml),
    # то есть SIGKILL приходит через 15 секунд. Под эти 15 секунд и посчитан
    # shutdownGraceMs прогрева в app/worker/tgOutreach.ts, а не под тридцать
    # минут отсюда.
    stop_grace_period: 30m
    # `autoheal=true` makes the autoheal sidecar (defined below) restart this
    # container whenever the healthcheck reports `unhealthy`. Docker's
    # `restart: unless-stopped` does NOT react to health status by itself —
    # we learned the hard way after gramJS hung in `_recvLoop` on a corrupted
    # MTProto packet and the worker sat unhealthy-but-running for ~36 hours
    # (heartbeat stale, zero dialogs sent, but container stayed Up).
    labels:
      - autoheal=true
    healthcheck:
      # Heartbeat is bumped every 30s by an independent setInterval in
      # worker/tgOutreach.ts (NOT inside the main loop), so this check reflects
      # node event loop aliveness — not whether the main loop is currently
      # busy. Keeping threshold at 900s for now to remain compatible with the
      # legacy build that wrote heartbeat only inside the per-account loop —
      # those builds can stall heartbeat 15+ min when все слоты заняты
      # anti-flood-паузами (220-545s). Once a build with the independent
      # heartbeat ticker is on prod we can drop this to 300s.
      test: ["CMD-SHELL", "test -f /tmp/tg-outreach-heartbeat && test $$(( $$(date +%s) - $$(cat /tmp/tg-outreach-heartbeat | cut -c1-10) )) -lt 900 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        # Память идёт за TG_OUTREACH_MAX_CONCURRENCY: каждая параллельная
        # кампания — это свой набор клиентов gramJS в одном процессе. 3072M
        # закладывались под 10 кампаний, лимит подняли до 12 — добавляем тот же
        # запас, иначе первый же день с полной загрузкой упрётся в OOM, и
        # docker снесёт воркер вместе со всеми идущими кампаниями.
        limits:
          memory: 4096M
          cpus: '2'
          pids: 512
    restart: unless-stopped
    networks:
      - portal-network

  worker-aicaller:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-aicaller
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
