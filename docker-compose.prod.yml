      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - BYO_MAILBOX_CRED_KEY=${BYO_MAILBOX_CRED_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=byoreplies
    stop_grace_period: 2m
    deploy:
