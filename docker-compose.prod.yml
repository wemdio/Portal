      - OPENROUTER_BRIEF_API_KEY=${OPENROUTER_BRIEF_API_KEY}
      # Модельный роутинг HE по итогам A/B eval (scripts/he-model-eval.mjs,
      # 2026-08-09): gpt-5.5 дал вдвое шире research-скан, чище письма,
      # ~3x быстрее и ~4x дешевле claude-opus-5. Фолбэк-модель не задаём
      # осознанно (HE_MODEL_CHAIN_FALLBACK пуст): честная ошибка вместо
      # тихой подмены — иначе метрики сравнения моделей смешаются.
      # 2026-08-22: CHAIN → google/gemini-3.1-pro-preview (eval: письма 8/8 без
      # LLM-маркеров против 5/8 у gpt-5.5); research/bulk остаются на gpt-5.5.
      - HE_MODEL_RESEARCH=openai/gpt-5.5
      - HE_MODEL_CHAIN=google/gemini-3.1-pro-preview
      - HE_MODEL_BULK=openai/gpt-5.5
      - SERPER_API_KEY=${SERPER_API_KEY}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - WORKER_KIND=hypothesis-engine
    stop_grace_period: 5m
    # autoheal + heartbeat healthcheck — защита от event-loop hang'ов
    # (паттерн worker-yandexmaps, инцидент 27.07.2026: процесс жив, а event
    # loop мёртв — без внешнего heartbeat такой стоп невидим). Heartbeat
    # пишется независимым setInterval в worker/hypothesisEngine.ts;
    # healthcheck флипает контейнер в unhealthy, если он старше 300с —
    # autoheal sidecar тогда `docker restart`.
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/hypothesis-engine-worker-heartbeat && test $$(( $$(date +%s) - $$(cat /tmp/hypothesis-engine-worker-heartbeat | cut -c1-10) )) -lt 300 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
