  # Telegram-сессии не нужны — читает только нашу БД и льёт ZIP в MAIN S3
  # multipart-стримом, так что env-переменных меньше, чем у logger'а.
  worker-sales-chat-archive:
    image: ${DOCKER_USERNAME}/portal-worker:prod
    container_name: portal-worker-sales-chat-archive
    env_file:
      - .env
    environment:
      - NODE_ENV=production
