version: v1.0
name: Nightly npm audit
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204
execution_time_limit:
  minutes: 30

# Ночной аудит зависимостей. Вынесен из пайплайна пушей (semaphore.yml):
# там он на каждом прогоне ходил в интернет, изредка подвисал и флапал,
# а ловит одно и то же независимо от частоты запуска.
#
# Подключение (один раз, в UI Semaphore): проект → Tasks → New task →
# pipeline file = .semaphore/nightly-audit.yml, branch = main,
# cron = "0 5 * * *" (утро по UTC, до начала рабочего дня).
# Упавший прогон виден в Semaphore как красный Nightly npm audit.

blocks:
  - name: npm audit
    dependencies: []
    task:
      secrets:
        - name: portal_secrets
      jobs:
        - name: audit
          commands:
            - checkout
            - sem-version node 22
            - cd app
            # Ключи те же, что в semaphore.yml (без имени ветки), иначе ночной
            # прогон промахивается мимо кэша, наполненного дневными пушами.
            - 'cache restore node-modules-v2-$(checksum package-lock.json),node-modules-v2-'
            # Без этого postinstall («playwright install chromium») качает ~150 МБ
            # с CDN каждую ночь ради проверки, которой браузер вообще не нужен.
            - 'cache restore playwright-v2-$(checksum package-lock.json),playwright-v2-'
            # Те же ретраи, что в semaphore.yml: postinstall тянет бинарники со
            # сторонних хостов, и ECONNRESET на них — не повод будить команду
            # ночным красным аудитом.
            - 'i=1; until npm install; do if [ $i -ge 3 ]; then echo "npm install не прошёл 3 раза подряд — это не флап сети, разбираться руками"; exit 1; fi; echo "npm install упал (попытка $i из 3), повтор через $((i*15))с"; sleep $((i*15)); i=$((i+1)); done'
            - npm audit --audit-level=critical
