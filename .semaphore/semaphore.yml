version: v1.0
name: Auto (push main)
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Run tests
    dependencies: []
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
          - PROJECT_DIR=$(ls -d */ | head -n1 | sed 's/\/$//')
          - cd $PROJECT_DIR
          - "if [ -d \"app\" ]; then\n  echo \"✅ app found in root\"\n  cd app\nelse\n  echo \"\U0001F50D Searching for app folder...\"\n  APP_PATH=$(find . -type d -name \"app\" -not -path \"*/node_modules/*\" | head -n1)\n  if [ -n \"$APP_PATH\" ]; then\n    echo \"✅ app found at $APP_PATH\"\n    cd $APP_PATH\n  else\n    echo \"❌ app folder not found!\"\n    ls -la\n    exit 1\n  fi\nfi\n"
          - pwd
          - 'cache restore node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json), node-modules'
          - npm ci
          - cache store node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json) node_modules
      jobs:
        - name: Lint and Test
          commands:
            - |
              if [ ! -f "package.json" ]; then
                PROJECT_DIR=$(ls -d */ | head -n1 | sed 's/\/$//')
                cd $PROJECT_DIR
                if [ -d "app" ]; then
                  cd app
                else
                  APP_PATH=$(find . -type d -name "app" -not -path "*/node_modules/*" | head -n1)
                  cd $APP_PATH
                fi
              fi
            - pwd
            - ls -la
            - npm run lint
            - npm test -- --watchAll=false
  - name: Push Docker image
    dependencies:
      - Run tests
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
          - PROJECT_DIR=$(ls -d */ | head -n1 | sed 's/\/$//')
          - cd $PROJECT_DIR
      jobs:
        - name: Build and Push
          commands:
            - 'echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin'
            - docker buildx create --use
            - |
              docker buildx build \
                --push \
                --tag ${DOCKER_USERNAME}/portal:prod \
                --build-arg NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} \
                --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY} \
                --platform linux/amd64 \
                -f Dockerfile \
                .
  - name: Deploy to production
    dependencies:
      - Push Docker image
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
          - PROJECT_DIR=$(ls -d */ | head -n1 | sed 's/\/$//')
          - cd $PROJECT_DIR
      jobs:
        - name: SSH Deploy
          commands:
            - sudo apt-get update && sudo apt-get install -y sshpass
            - |
              sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=no \
                docker-compose.prod.yml \
                ${USER}@${HOST}:/home/Portal/prod/
            - |
              sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=no \
                ${USER}@${HOST} "
                set -e
                cd /home/Portal/prod/
                echo '${DOCKER_PASSWORD}' | sudo docker login -u '${DOCKER_USERNAME}' --password-stdin
                sudo docker compose version
                sudo docker compose -p portal -f docker-compose.prod.yml pull portal
                sudo docker ps -a --filter 'label=com.docker.compose.service=portal' -q | xargs -r sudo docker rm -f
                sudo docker compose -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate portal
                sudo docker image prune -f
                sudo docker volume prune -f
              "
