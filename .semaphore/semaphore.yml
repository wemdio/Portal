version: v1.0
name: Auto (push) — branch-aware test/build
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204
execution_time_limit:
  hours: 3
blocks:
  - name: Run tests
    dependencies: []
    run:
      when: branch != 'main' AND branch != 'test'
    task:
      secrets:
        - name: portal_secrets
      prologue:
        commands:
          - checkout
          - sem-version node 22
          - ROOT_DIR="$(pwd)"
          - 'if [ -d "${ROOT_DIR}/app" ]; then APP_PATH="${ROOT_DIR}/app"; else APP_REL_PATH=$(find "${ROOT_DIR}" -type d -name "app" -not -path "*/node_modules/*" | head -n1); if [ -n "$APP_REL_PATH" ]; then APP_PATH="$APP_REL_PATH"; else echo "app folder not found!"; exit 1; fi; fi'
          - echo "APP_PATH=$APP_PATH" >> /tmp/env_vars
          - cd $APP_PATH
          - 'cache restore node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json), node-modules'
          - npm install
          - cache store node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json) node_modules
      jobs:
        - name: 'Lint, typecheck, build, test, audit'
          commands:
            - source /tmp/env_vars
            - cd $APP_PATH
            - 'export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"'
            - npm run lint
            - npx tsc --noEmit
            - npm run build
            - npm test -- --watchAll=false
            - npm audit --audit-level=critical
  - name: Push Docker image
    dependencies: []
    run:
      when: branch = 'main'
    task:
      secrets:
        - name: portal_secrets
      prologue:
        commands:
          - checkout
      jobs:
        - name: Build and Push
          commands:
            - 'echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin'
            - docker buildx create --use
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal:prod --build-arg NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY} --build-arg NEXT_PUBLIC_RDP_WS_URL=${NEXT_PUBLIC_RDP_WS_URL} --build-arg NEXT_PUBLIC_SIGNUP_HOSTS=${NEXT_PUBLIC_SIGNUP_HOSTS} --platform linux/amd64 -f Dockerfile .'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-yandexmaps:prod --platform linux/amd64 -f services/yandexmaps/Dockerfile services/yandexmaps'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-rdp-ws:prod --platform linux/amd64 -f services/rdp-ws/Dockerfile services/rdp-ws'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-worker:prod --platform linux/amd64 -f Dockerfile.worker .'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-health-check:prod --platform linux/amd64 -f services/health-check/Dockerfile services/health-check'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-atmos-bot:prod --platform linux/amd64 -f services/atmos-bot/Dockerfile services/atmos-bot'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-transcribe-worker:prod --platform linux/amd64 -f services/transcribe-worker/Dockerfile services/transcribe-worker'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-instantly-sync-bot:prod --platform linux/amd64 -f services/instantly-sync-bot/Dockerfile services/instantly-sync-bot'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-backup:prod --platform linux/amd64 -f services/backup/Dockerfile services/backup'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-changelog-bot:prod --platform linux/amd64 -f services/changelog-bot/Dockerfile services/changelog-bot'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-polza-reports:prod --platform linux/amd64 -f services/polza-reports/Dockerfile services/polza-reports'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-openoutreach:prod --platform linux/amd64 -f services/openoutreach/compose/linkedin/Dockerfile services/openoutreach'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-external-sync:prod --platform linux/amd64 -f services/portal-external-sync/Dockerfile services/portal-external-sync'
