version: v1.0
name: Auto (push) — branch-aware test/build
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204
execution_time_limit:
  hours: 3

# ─── Сборка образов: параллельные блоки + change_in + registry-кэш ────────────
# Было: 13 образов паровозиком в одной джобе (~10 мин на каждый пуш в main).
# Стало:
#   - каждый образ — свой блок с change_in(): пересборка только если менялись
#     его файлы (или сам этот yml — дефолтное поведение change_in);
#   - блоки без зависимостей выполняются параллельно: время = самый долгий
#     изменившийся образ, а не сумма всех;
#   - portal/worker (самые тяжёлые) кэшируют слои в registry (:buildcache,
#     mode=max покрывает и deps-стадию) — npm install переиспользуется, пока
#     не менялся package-lock.json;
#   - бонус для деплоя: непересобранный образ сохраняет digest, и docker
#     compose не пересоздаёт его контейнер (не ждёт stop_grace воркеров).
# ВАЖНО: новый сервис = новый блок здесь + контейнер в scheduled-deploy.yml.

blocks:
  - name: Run tests
    dependencies: []
    run:
      # change_in: ветки, у которых текущий пуш не тронул app/, не гоняют
      # 2-минутный прогон. branch_range принудительно сужает сравнение до
      # диапазона именно этого пуша ($SEMAPHORE_GIT_COMMIT_RANGE = коммиты
      # from..to последнего push). Без этого Semaphore по умолчанию берёт
      # merge-base с main → на давно разошедшейся ветке правки в app/
      # накопились и change_in всегда true.
      when: "branch != 'main' AND branch != 'test' AND change_in('/app/', {default_branch: 'main', branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE'})"
    task:
      secrets:
        - name: portal_secrets
      prologue:
        commands:
          - checkout
          - sem-version node 22
          - ROOT_DIR="$(pwd)"
          - 'if [ -d "${ROOT_DIR}/app" ]; then APP_PATH="${ROOT_DIR}/app"; else APP_REL_PATH=$(find "${ROOT_DIR}" -type d -name "app" -not -path "*/node_modules/*" | head -n1); if [ -n "$APP_REL_PATH" ]; then APP_PATH="$APP_REL_PATH"; else echo "app folder not found!"; exit 1; fi; fi'
          - echo "APP_PATH=$APP_PATH" >> /tmp/env_vars
          - cd $APP_PATH
          - 'cache restore node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json), node-modules'
          - npm install
          - cache store node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json) node_modules
      # Две параллельные джобы вместо паровозика: сборка (самый долгий шаг,
      # ~2-2.5 мин) идёт одновременно с линтом/типами/тестами. Время блока =
      # самая долгая джоба, а не сумма шагов. node_modules у обеих из кэша
      # (prologue общий). .next/cache кэшируется между прогонами — повторная
      # сборка на ветке инкрементальная; протухание безопасно: Next сверяет
      # содержимое по хэшам, максимум соберёт медленнее.
      jobs:
        - name: 'Lint, typecheck, test'
          commands:
            - source /tmp/env_vars
            - cd $APP_PATH
            - 'export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"'
            - npm run lint
            # Инкрементальный tsc: .tsbuildinfo.ci помнит прошлый прогон,
            # перепроверяются только изменённые файлы (−20-40с). Протухший
            # кэш безопасен — tsc сверяет по содержимому.
            - 'cache restore tsc-$SEMAPHORE_GIT_BRANCH,tsc-'
            - npx tsc --noEmit --incremental --tsBuildInfoFile .tsbuildinfo.ci
            - 'cache store tsc-$SEMAPHORE_GIT_BRANCH .tsbuildinfo.ci'
            # npm audit переехал в ночной прогон (.semaphore/nightly-audit.yml):
            # на каждом пуше он ходил в интернет и изредка подвисал/флапал.
            - npm test -- --watchAll=false
        - name: 'Next build'
          commands:
            - source /tmp/env_vars
            - cd $APP_PATH
            - 'export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"'
            - 'cache restore nextjs-$SEMAPHORE_GIT_BRANCH,nextjs-'
            - npm run build
            - 'cache store nextjs-$SEMAPHORE_GIT_BRANCH .next/cache'

  - name: Build portal
    dependencies: []
    run:
      when: "branch = 'main' AND change_in(['/app/', '/Dockerfile', '/entrypoint.sh', '/supabase/migrations/', '/supabase/instantly-migrations/'], {default_branch: 'main'})"
    task:
      secrets:
        - name: portal_secrets
      prologue:
        commands:
          - checkout
          - 'echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin'
          - docker buildx create --use
      jobs:
        - name: portal
          commands:
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal:prod --cache-from type=registry,ref=${DOCKER_USERNAME}/portal:buildcache --cache-to type=registry,ref=${DOCKER_USERNAME}/portal:buildcache,mode=max --build-arg NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY} --build-arg NEXT_PUBLIC_RDP_WS_URL=${NEXT_PUBLIC_RDP_WS_URL} --build-arg NEXT_PUBLIC_SIGNUP_HOSTS=${NEXT_PUBLIC_SIGNUP_HOSTS} --platform linux/amd64 -f Dockerfile .'

  - name: Build worker
    dependencies: []
    run:
      when: "branch = 'main' AND change_in(['/app/', '/Dockerfile.worker'], {default_branch: 'main'})"
    task:
