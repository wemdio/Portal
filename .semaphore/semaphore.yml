version: v1.0
name: Auto (push) — branch-aware test/build
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204
execution_time_limit:
  hours: 3

# ─── Не дожигать устаревшие прогоны ──────────────────────────────────────────
# Semaphore считает минуты как сумму по всем джобам, а не по времени «от и до»,
# поэтому серия быстрых пушей оплачивается как столько же полных прогонов,
# хотя полезен из них только последний.
#   - ветки: отменяем и очередь, и уже запущенное — обратная связь по коммиту,
#     который уже перезаписан следующим, никому не нужна;
#   - main: только очередь. Начатую сборку образа прерывать нельзя — деплой
#     тянет :prod и должен получить готовый образ, а не половину.
auto_cancel:
  running:
    when: "branch != 'main'"
  queued:
    when: "branch = 'main'"

# Упавший линт больше не даёт соседней джобе докрутить свою сборку в никуда.
# На main не включаем: если упала сборка portal, сборка worker обязана дойти
# до конца, иначе следующий деплой не получит свежий образ воркера.
fail_fast:
  stop:
    when: "branch != 'main'"

# ─── Сборка образов: параллельные блоки + change_in + registry-кэш ────────────
# Было: 13 образов паровозиком в одной джобе (~10 мин на каждый пуш в main).
# Стало:
#   - каждый образ — свой блок с change_in(): пересборка только если менялись
#     его файлы (или сам этот yml — дефолтное поведение change_in);
#   - блоки без зависимостей выполняются параллельно: время = самый долгий
#     изменившийся образ, а не сумма всех;
#   - portal/worker (самые тяжёлые) кэшируют слои в registry (:buildcache,
#     mode=max покрывает и deps-стадию) — npm install переиспользуется, пока
#     не менялся package-lock.json;
#   - бонус для деплоя: непересобранный образ сохраняет digest, и docker
#     compose не пересоздаёт его контейнер (не ждёт stop_grace воркеров).
# ВАЖНО: новый сервис = новый блок здесь + контейнер в scheduled-deploy.yml.

blocks:
  - name: Run tests
    dependencies: []
    run:
      # change_in: ветки, у которых текущий пуш не тронул app/, не гоняют
      # прогон. branch_range принудительно сужает сравнение до диапазона
      # именно этого пуша ($SEMAPHORE_GIT_COMMIT_RANGE = коммиты from..to
      # последнего push). Без этого Semaphore по умолчанию берёт merge-base
      # с main → на давно разошедшейся ветке правки в app/ накопились и
      # change_in всегда true.
      when: "branch != 'main' AND branch != 'test' AND change_in('/app/', {default_branch: 'main', branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE'})"
    task:
      secrets:
        - name: portal_secrets
      prologue:
        commands:
          - checkout
          - sem-version node 22
          - ROOT_DIR="$(pwd)"
          - 'if [ -d "${ROOT_DIR}/app" ]; then APP_PATH="${ROOT_DIR}/app"; else APP_REL_PATH=$(find "${ROOT_DIR}" -type d -name "app" -not -path "*/node_modules/*" | head -n1); if [ -n "$APP_REL_PATH" ]; then APP_PATH="$APP_REL_PATH"; else echo "app folder not found!"; exit 1; fi; fi'
          - echo "APP_PATH=$APP_PATH" >> /tmp/env_vars
          - cd $APP_PATH
          # Ключ без имени ветки: package-lock.json и так однозначно определяет
          # содержимое node_modules, а $SEMAPHORE_GIT_BRANCH плодил отдельную
          # копию на каждую ветку. Квота кэша забивалась дублями, старые записи
          # вытеснялись, и новая ветка регулярно промахивалась мимо уже готовых
          # зависимостей и ставила их с нуля.
          #
          # Префикс v2 — потому что Semaphore НЕ перезаписывает существующие
          # ключи: под старым именем лежит запись, сделанная до появления метки
          # .ci-lock-checksum, и положить туда исправленную было бы нельзя.
          - 'LOCK_SUM=$(checksum package-lock.json)'
          - 'cache restore node-modules-v2-${LOCK_SUM},node-modules-v2-'
          # Метка внутри node_modules означает, что кэш собран ровно под этот
          # package-lock.json: postinstall там уже отработал — patch-package
          # применён, биндинги sqlite3 собраны. Тогда всё, что ниже (браузеры
          # Playwright, npm install, запись кэшей), не нужно вовсе.
          - 'if [ -f node_modules/.ci-lock-checksum ] && [ "$(cat node_modules/.ci-lock-checksum)" = "${LOCK_SUM}" ]; then SKIP_NPM_INSTALL=1; else SKIP_NPM_INSTALL=0; fi'
          # Браузеры Playwright (~150 МБ, лежат вне node_modules, в
          # $HOME/.cache/ms-playwright) раньше поднимались из кэша в КАЖДОЙ
          # джобе блока, хотя ни один jest-тест браузер не запускает: браузер
          # нужен только postinstall'у (`playwright install chromium`), то есть
          # исключительно на промахе кэша node_modules. Теперь и восстановление,
          # и запись этого кэша живут внутри ветки «ставим зависимости заново».
          - 'if [ "$SKIP_NPM_INSTALL" = 0 ]; then cache restore playwright-v2-${LOCK_SUM},playwright-v2-; fi'
          # npm install с ретраями. Установка ходит в сеть не только за
          # тарболами npm: postinstall тянет бинарники со сторонних хостов —
          # ffmpeg-static качает ~80 МБ с GitHub Releases, `playwright install
          # chromium` ещё ~150 МБ. Любой ECONNRESET на этой загрузке валит весь
          # блок целиком (prologue общий у всех джоб), и красный билд выглядит
          # как ошибка в коде, хотя код не при чём — 12.08.2026 так упали два
          # прогона подряд на ffmpeg-static.
          #
          # Ретрай, а не --ignore-scripts: без скриптов не применится
          # patch-package (патч TL-схемы GramJS) и не соберутся биндинги
          # sqlite3, а они нужны tests/lib/telegram/sqliteReader.test.ts.
          #
          # Запись кэшей — здесь же, а не безусловным хвостом пролога: при
          # попадании в кэш `cache store` под уже существующим ключом всё равно
          # упаковывал многогигабайтные node_modules, чтобы в итоге ничего не
          # записать, и делал это в каждой джобе блока.
          - 'if [ "$SKIP_NPM_INSTALL" = 1 ]; then echo "[ci] node_modules из кэша ровно под этот package-lock.json — установка не нужна"; else i=1; until npm install; do if [ $i -ge 3 ]; then echo "npm install не прошёл 3 раза подряд — это не флап сети, разбираться руками"; exit 1; fi; echo "npm install упал (попытка $i из 3), повтор через $((i*15))с"; sleep $((i*15)); i=$((i+1)); done; printf %s "${LOCK_SUM}" > node_modules/.ci-lock-checksum; cache store node-modules-v2-${LOCK_SUM} node_modules; if [ -d "$HOME/.cache/ms-playwright" ]; then cache store playwright-v2-${LOCK_SUM} "$HOME/.cache/ms-playwright"; fi; fi'
      # Одна джоба намеренно, хотя блок мог бы разложиться на параллельные.
      #
      # Semaphore считает минуты СУММОЙ по всем джобам, а не временем «от и
      # до», и каждая джоба заново платит за пролог: checkout репозитория
      # (357 МБ) и подъём node_modules (1,3 ГБ, 88 тысяч файлов) — около
      # минуты. Поэтому раскладка на пять параллельных джоб, которая тут была
      # 31.08.2026, сокращала ожидание втрое (6:40 → ~2:30), но добавляла в
      # счёт четыре лишних пролога: 8:44 → ~11:45 оплачиваемых минут.
      #
      # После сокращения набора тестов (8423 → 1987 проверок) параллелить
      # стало незачем: весь прогон тестов занимает меньше минуты, и делить его
      # на машины дороже, чем прогнать подряд.
      #
      # Порядок шагов — от самого дешёвого к самому дорогому: линт и типы
      # отваливаются за секунды и не дают платить за тесты и сборку, когда
      # правка не компилируется (fail_fast на ветках выключает и остальное).
      jobs:
        - name: 'Checks and build'
          commands:
            - source /tmp/env_vars
            - cd $APP_PATH
            - 'export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"'
            # Один кэш на обе медленные проверки: и eslint (.next/cache/eslint),
            # и incremental-состояние tsc (.next/cache/tsc) лежат в .next/cache
            # и вместе весят ~3,5 МБ. Замеры на этом проекте:
            #   eslint      без кэша 1 мин 53 с → с кэшем 4 с
            #   typecheck   без кэша 5 мин 45 с → с кэшем 23 с
            #
            # Ключ включает SHA коммита, потому что Semaphore НЕ перезаписывает
            # существующие ключи. Прежний постоянный ключ <префикс>-<ветка>
            # означал, что кэш клал только ПЕРВЫЙ прогон ветки, а все следующие
            # store были молчаливым no-op: состояние замирало и дальше только
            # устаревало, съедая обратно всю экономию. Восстановление идёт по
            # префиксу, так что подхватывается самый недавний прогон ветки, а
            # 3,5 МБ на прогон не создают проблем для квоты кэша.
            - 'cache restore checks-$SEMAPHORE_GIT_BRANCH-$SEMAPHORE_GIT_SHA,checks-$SEMAPHORE_GIT_BRANCH-,checks-'
            # eslint кэширует по содержимому файла (--cache-strategy content в
            # npm-скрипте), а не по времени модификации: свежий checkout ставит
            # новые mtime всем файлам, и стратегия по умолчанию сделала бы кэш
            # бесполезным.
            - npm run lint
            # Общий сценарий используется также production Docker-сборкой:
            # typegen и два tsc идут отдельными процессами и не суммируют heap.
            - npm run typecheck:strict
            - 'cache store checks-$SEMAPHORE_GIT_BRANCH-$SEMAPHORE_GIT_SHA .next/cache'
            # npm audit переехал в ночной прогон (.semaphore/nightly-audit.yml):
            # на каждом пуше он ходил в интернет и изредка подвисал/флапал.
            #
            # --maxWorkers=2: у e1-standard-2 два ядра, а jest по умолчанию
            # берёт cpus-1 = 1 воркер и гонял бы набор последовательно.
            # --workerIdleMemoryLimit перезапускает раздувшийся воркер, чтобы
            # два процесса не вышли за физические 4 ГБ runner-а.
            #
            # В ключе кэша нет имени ветки: jest хранит результат трансформации
            # по хэшу содержимого файла, поэтому кэш соседней ветки не «чужой» —
            # он промахнётся ровно на тех файлах, которые с тех пор поменялись.
            # Ротация по дню — потому что ключи не перезаписываются.
            - 'cache restore jest-v2-$(date +%Y%m%d),jest-v2-'
            - 'npm test -- --watchAll=false --maxWorkers=2 --workerIdleMemoryLimit=1200MB --cacheDirectory=.jest-cache'
            - 'cache store jest-v2-$(date +%Y%m%d) .jest-cache'
            # Ежедневная ротация ключа — та же причина, что у кэша проверок
            # выше: постоянный ключ nextjs-<ветка> означал, что .next/cache
            # клал только первый прогон ветки, а дальше store молча ничего не
            # делал и сборка переставала быть инкрементальной.
            #
            # Здесь, в отличие от кэша проверок, ключ по дню, а не по коммиту:
            # webpack-кэш Next весит сотни мегабайт, и запись на каждый пуш
            # вытеснила бы из квоты всё остальное.
            - 'cache restore nextjs-v2-$SEMAPHORE_GIT_BRANCH-$(date +%Y%m%d),nextjs-v2-$SEMAPHORE_GIT_BRANCH-,nextjs-v2-'
            # Проверку типов Next пропускает: строгий tsc уже отработал выше в
            # этой же джобе, а повторная после успешной компиляции упирается в
            # физические 4 ГБ runner-а.
            - 'NEXT_BUILD_SKIP_TYPECHECK=1 npm run build'
            - 'cache store nextjs-v2-$SEMAPHORE_GIT_BRANCH-$(date +%Y%m%d) .next/cache'
  - name: Build portal
    dependencies: []
    run:
      when: "branch = 'main' AND change_in(['/app/', '/Dockerfile', '/entrypoint.sh', '/supabase/migrations/', '/supabase/instantly-migrations/'], {default_branch: 'main'})"
    task:
      secrets:
        - name: portal_secrets
      prologue:
        commands:
          - checkout
          - 'echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin'
          - docker buildx create --use
      jobs:
        - name: portal
          commands:
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal:prod --cache-from type=registry,ref=${DOCKER_USERNAME}/portal:buildcache --cache-to type=registry,ref=${DOCKER_USERNAME}/portal:buildcache,mode=max --build-arg NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY} --build-arg NEXT_PUBLIC_RDP_WS_URL=${NEXT_PUBLIC_RDP_WS_URL} --build-arg NEXT_PUBLIC_SIGNUP_HOSTS=${NEXT_PUBLIC_SIGNUP_HOSTS} --platform linux/amd64 -f Dockerfile .'

  - name: Build worker
