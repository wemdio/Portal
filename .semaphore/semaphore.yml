version: v1.0
name: Auto (push main)
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Run tests
    dependencies: []
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
          - ROOT_DIR="$(pwd)"
          - 'if [ -d "${ROOT_DIR}/app" ]; then APP_PATH="${ROOT_DIR}/app"; else APP_REL_PATH=$(find "${ROOT_DIR}" -type d -name "app" -not -path "*/node_modules/*" | head -n1); if [ -n "$APP_REL_PATH" ]; then APP_PATH="$APP_REL_PATH"; else echo "app folder not found!"; exit 1; fi; fi'
          - echo "APP_PATH=$APP_PATH" >> /tmp/env_vars
          - cd $APP_PATH
          - 'cache restore node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json), node-modules'
          - npm ci
          - cache store node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json) node_modules
      jobs:
        - name: Lint and Test
          commands:
            - source /tmp/env_vars
            - cd $APP_PATH
            - npm run lint
            - npm test -- --watchAll=false
  - name: Push Docker image
    dependencies:
      - Run tests
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
      jobs:
        - name: Build and Push
          commands:
            - 'echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin'
            - DOCKERFILE_PATH="$(find . -name "Dockerfile" -type f | head -n1)"
            - 'if [ -z "$DOCKERFILE_PATH" ]; then echo "Dockerfile not found!"; exit 1; fi'
            - 'echo "Using Dockerfile: $DOCKERFILE_PATH"'
            - docker buildx create --use
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal:prod --build-arg NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY} --platform linux/amd64 -f "$DOCKERFILE_PATH" .'
  - name: Deploy to production
    dependencies:
      - Push Docker image
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
      jobs:
        - name: SSH Deploy
          commands:
            - sudo apt-get update && sudo apt-get install -y sshpass
            - 'sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${USER}@${HOST}:/home/Portal/prod/'
            - >-
              sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=no ${USER}@${HOST} "set -e; cd /home/Portal/prod/; echo '${DOCKER_PASSWORD}' | sudo docker login -u '${DOCKER_USERNAME}' --password-stdin; sudo docker compose version; sudo docker compose -p portal -f docker-compose.prod.yml pull portal; sudo docker ps -a --filter 'label=com.docker.compose.service=portal' -q | xargs -r sudo docker rm -f; sudo docker compose -p portal -f docker-compose.prod.yml up -d --no-deps
              --force-recreate portal; sudo docker image prune -f; sudo docker volume prune -f"

