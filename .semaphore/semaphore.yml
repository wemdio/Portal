version: v1.0
name: Auto (push main)
execution_time_limit:
  hours: 3
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Run tests
    dependencies: []
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
          - ROOT_DIR="$(pwd)"
          - 'if [ -d "${ROOT_DIR}/app" ]; then APP_PATH="${ROOT_DIR}/app"; else APP_REL_PATH=$(find "${ROOT_DIR}" -type d -name "app" -not -path "*/node_modules/*" | head -n1); if [ -n "$APP_REL_PATH" ]; then APP_PATH="$APP_REL_PATH"; else echo "app folder not found!"; exit 1; fi; fi'
          - echo "APP_PATH=$APP_PATH" >> /tmp/env_vars
          - cd $APP_PATH
          - 'cache restore node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json), node-modules'
          - npm ci
          - cache store node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package-lock.json) node_modules
      jobs:
        - name: Lint and Test
          commands:
            - source /tmp/env_vars
            - cd $APP_PATH
            - npm run lint
            - npm test -- --watchAll=false
  - name: Push Docker image
    dependencies:
      - Run tests
    run:
      when: "branch = 'main'"
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
      jobs:
        - name: Build and Push
          commands:
            - 'echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin'
            - docker buildx create --use
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal:prod --build-arg NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY} --platform linux/amd64 -f Dockerfile .'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-yandexmaps:prod --platform linux/amd64 -f services/yandexmaps/Dockerfile services/yandexmaps'
            - 'docker buildx build --push --tag ${DOCKER_USERNAME}/portal-worker:prod --platform linux/amd64 -f Dockerfile.worker .'
  - name: Deploy to production
    dependencies:
      - Push Docker image
    run:
      when: "branch = 'main'"
    task:
      secrets:
        - name: portal-secrets
      prologue:
        commands:
          - checkout
      jobs:
        - name: SSH Deploy
          execution_time_limit:
            minutes: 120
          commands:
            - sudo apt-get update && sudo apt-get install -y sshpass
            - >-
              sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=no ${USER}@${HOST}
              "sudo -n mkdir -p /home/Portal/prod && sudo -n chown -R ${USER}:${USER} /home/Portal/prod"
            - 'sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=no docker-compose.prod.yml drain-worker.sh ${USER}@${HOST}:/home/Portal/prod/'
            - |-
              {
                # first line goes into DOCKER_PASSWORD on the server
                printf '%s\n' "${DOCKER_PASSWORD}";
                cat <<'EOS'
              set -euo pipefail

              read -r DOCKER_PASSWORD
              DEPLOY_DIR="/home/Portal/prod"

              echo '--- Step 0: ensure deps (skip if already present) ---'
              if ! command -v apt-get >/dev/null 2>&1; then
                echo "apt-get not found; can't auto-install dependencies on this server"
                exit 1
              fi

              need_apt=0
              if ! command -v curl >/dev/null 2>&1; then need_apt=1; fi
              if ! command -v python3 >/dev/null 2>&1; then need_apt=1; fi

              if [ "$need_apt" -eq 1 ]; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y curl python3 ca-certificates
              fi

              if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
                echo "[deps] Installing Docker + Compose plugin (get.docker.com)..."
                curl -fsSL https://get.docker.com | sh
                systemctl enable --now docker >/dev/null 2>&1 || true
              else
                echo "[deps] Docker + Compose already installed — skipping"
              fi

              mkdir -p "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              chmod +x drain-worker.sh

              echo '--- Step 1: drain worker (wait for current job to finish) ---'
              bash drain-worker.sh

              echo '--- Step 2: pull new images ---'
              printf '%s\n' "$DOCKER_PASSWORD" | docker login -u "${DOCKER_USERNAME}" --password-stdin
              docker compose -p portal -f docker-compose.prod.yml pull portal yandexmaps worker

              echo '--- Step 3: restart portal + yandexmaps ---'
              docker ps -a --filter 'label=com.docker.compose.service=portal' -q | xargs -r docker rm -f
              docker ps -a --filter 'label=com.docker.compose.service=yandexmaps' -q | xargs -r docker rm -f
              docker compose -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate portal yandexmaps

              echo '--- Step 4: restart worker with new code ---'
              docker compose -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate worker

              docker image prune -f
              docker volume prune -f
              echo '--- Deploy complete ---'
              EOS
              } | sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=no ${USER}@${HOST} "sudo -n DOCKER_USERNAME='${DOCKER_USERNAME}' bash -s"

