version: v1.0
name: Scheduled Deploy (3 AM) — pull and deploy
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204
execution_time_limit:
  hours: 3
blocks:
  - name: Deploy if main changed
    dependencies: []
    task:
      secrets:
        - name: portal_secrets
      prologue:
        commands:
          - checkout
          - git fetch origin main 2>/dev/null || true
          - sudo apt-get update && sudo apt-get install -y sshpass
      jobs:
        - name: Pull and deploy
          execution_time_limit:
            minutes: 30
          commands:
            - |
              set -e
              COMMIT_SHA=$(git rev-parse HEAD)
              echo "Current main SHA: $COMMIT_SHA"
              echo "CI egress: $(curl -fsS --max-time 10 https://api.ipify.org 2>/dev/null || echo '<unknown>')"
              # Без маскировки ошибки: иначе при таймауте LAST пустой и деплой идёт как «новый коммит» впустую.
              # ConnectTimeout — не висеть на мёртвом маршруте; keepalive — длинный remote-скрипт (docker pull).
              # Ретраи: «Connection closed by … port 22» часто при шторме брутфорса / MaxStartups — второй заход через паузу проходит.
              SSH_BASE="-o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ConnectionAttempts=2 -o TCPKeepAlive=yes"
              SSH_LONG="${SSH_BASE} -o ServerAliveInterval=30 -o ServerAliveCountMax=8"
              SSH_RETRIES=4
              SSH_RETRY_PAUSE=25

              run_ssh() {
                desc="$1"
                remote="$2"
                n=1
                while [ "$n" -le "$SSH_RETRIES" ]; do
                  if sshpass -p "${SERVER_PASSWORD}" ssh ${SSH_BASE} ${USER}@${HOST} "$remote"; then
                    return 0
                  fi
                  echo "[scheduled] ${desc}: SSH не удалась (попытка ${n}/${SSH_RETRIES})" >&2
                  n=$((n + 1))
                  [ "$n" -le "$SSH_RETRIES" ] && sleep "$SSH_RETRY_PAUSE"
                done
                return 1
              }

              run_scp() {
                desc="$1"
                shift
                n=1
                while [ "$n" -le "$SSH_RETRIES" ]; do
                  if sshpass -p "${SERVER_PASSWORD}" scp ${SSH_BASE} "$@"; then
                    return 0
                  fi
                  echo "[scheduled] ${desc}: scp не удалась (попытка ${n}/${SSH_RETRIES})" >&2
                  n=$((n + 1))
                  [ "$n" -le "$SSH_RETRIES" ] && sleep "$SSH_RETRY_PAUSE"
                done
                return 1
              }

              LAST=""
              ok_last=0
              n=1
              while [ "$n" -le "$SSH_RETRIES" ]; do
                if t=$(sshpass -p "${SERVER_PASSWORD}" ssh ${SSH_BASE} ${USER}@${HOST} \
                  "cat /home/Portal/prod/last_deploy_sha 2>/dev/null || true"); then
                  LAST="$t"
                  ok_last=1
                  break
                fi
                echo "[scheduled] чтение last_deploy_sha: попытка ${n}/${SSH_RETRIES} не удалась (сервер оборвал до входа?)" >&2
                n=$((n + 1))
                [ "$n" -le "$SSH_RETRIES" ] && sleep "$SSH_RETRY_PAUSE"
              done
              [ "$ok_last" = 1 ] || { echo "[scheduled] Не удалось подключиться по SSH после ${SSH_RETRIES} попыток. Проверь с сервера: ss -tn state established '( sport = :22 )' | wc -l и MaxStartups в sshd_config." >&2; exit 1; }
              echo "Last deployed SHA: ${LAST:-<none>}"

              if [ "$COMMIT_SHA" = "$LAST" ]; then
                echo "[scheduled] No new commits on main since last deploy — skipping."
                exit 0
              fi

              echo "[scheduled] New commits detected — pulling images and deploying."

              run_ssh "mkdir prod" \
                "sudo -n mkdir -p /home/Portal/prod && sudo -n chown -R ${USER}:${USER} /home/Portal/prod"

              run_ssh "backup prod files to S3" \
                "cd /home/Portal/prod;
                if [ ! -f .env ]; then echo '[backup] .env not found, skipping'; exit 0; fi;
                SUPA_URL=\$(grep '^NEXT_PUBLIC_SUPABASE_URL=' .env | tail -1 | cut -d= -f2-);
                SUPA_KEY=\$(grep '^SUPABASE_SERVICE_ROLE_KEY=' .env | tail -1 | cut -d= -f2-);
                if [ -z \"\${SUPA_URL}\" ] || [ -z \"\${SUPA_KEY}\" ]; then echo '[backup] Supabase env vars missing, skipping'; exit 0; fi;
                TS=\$(date -u +%Y%m%d_%H%M%S);
                ok=0; fail=0;
                for f in .env docker-compose.prod.yml drain-worker.sh 50x.html last_deploy_sha; do
                  [ -f \"\$f\" ] || continue;
                  HTTP_CODE=\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                    -X POST \"\${SUPA_URL}/storage/v1/object/deploy-backups/\${TS}/\${f}\" \
                    -H \"Authorization: Bearer \${SUPA_KEY}\" \
                    -H 'Content-Type: application/octet-stream' \
                    -H 'x-upsert: true' \
                    --data-binary @\"\${f}\");
                  if [ \"\${HTTP_CODE}\" = '200' ] || [ \"\${HTTP_CODE}\" = '201' ]; then
                    echo \"[backup] \${f} -> deploy-backups/\${TS}/\${f} (HTTP \${HTTP_CODE})\";
                    ok=\$((ok + 1));
                  else
                    echo \"[backup] FAILED \${f} (HTTP \${HTTP_CODE})\" >&2;
                    fail=\$((fail + 1));
                  fi;
                done;
                echo \"[backup] Done: \${ok} uploaded, \${fail} failed\""

              # ─── Instantly DB server (optional): sync compose + migrations, up stack, wait for migrator ───
              # Semaphore secrets / env: INSTANTLY_DB_SSH_HOST (enable). Optional: INSTANTLY_DB_SSH_USER (default: USER),
              # INSTANTLY_DB_SSH_PASSWORD (default: SERVER_PASSWORD), INSTANTLY_DB_REMOTE_DIR (default: /opt/instantly-db).
              # One-time Supabase → local PG copy: set INSTANTLY_SOURCE_DB_URL (pooler URL). Skipped if .supabase_import_done exists.
              # Re-run import: INSTANTLY_FORCE_SUPABASE_IMPORT=1 (removes marker). DB server must have .env (see deploy/instantly-db/.env.example).
              IDB_HOST="${INSTANTLY_DB_SSH_HOST:-}"
              if [ -n "$IDB_HOST" ]; then
                IDB_USER="${INSTANTLY_DB_SSH_USER:-$USER}"
                IDB_PASS="${INSTANTLY_DB_SSH_PASSWORD:-$SERVER_PASSWORD}"
                IDB_PATH="${INSTANTLY_DB_REMOTE_DIR:-/opt/instantly-db}"
                run_ssh_idb() {
                  desc="$1"
                  remote="$2"
                  n=1
                  while [ "$n" -le "$SSH_RETRIES" ]; do
                    if sshpass -p "${IDB_PASS}" ssh ${SSH_BASE} ${IDB_USER}@${IDB_HOST} "$remote"; then
                      return 0
                    fi
                    echo "[scheduled] ${desc}: SSH (instantly-db) не удалась (попытка ${n}/${SSH_RETRIES})" >&2
                    n=$((n + 1))
                    [ "$n" -le "$SSH_RETRIES" ] && sleep "$SSH_RETRY_PAUSE"
                  done
                  return 1
                }
                run_scp_idb() {
                  desc="$1"
                  shift
                  n=1
                  while [ "$n" -le "$SSH_RETRIES" ]; do
                    if sshpass -p "${IDB_PASS}" scp ${SSH_BASE} "$@"; then
                      return 0
                    fi
                    echo "[scheduled] ${desc}: scp (instantly-db) не удалась (попытка ${n}/${SSH_RETRIES})" >&2
                    n=$((n + 1))
                    [ "$n" -le "$SSH_RETRIES" ] && sleep "$SSH_RETRY_PAUSE"
                  done
                  return 1
                }
                echo "[scheduled] Instantly DB: syncing to ${IDB_USER}@${IDB_HOST}:${IDB_PATH}"
                IDB_TMP=$(mktemp -d)
                mkdir -p "${IDB_TMP}/migrations" "${IDB_TMP}/scripts/db"
                cp deploy/instantly-db/docker-compose.yml "${IDB_TMP}/"
                cp deploy/instantly-db/scripts/db/ensureDatabase.js "${IDB_TMP}/scripts/db/"
                shopt -s nullglob
                cp supabase/instantly-migrations/*.sql "${IDB_TMP}/migrations/" || true
                shopt -u nullglob
                run_ssh_idb "mkdir instantly-db" "sudo -n mkdir -p ${IDB_PATH} && sudo -n chown -R ${IDB_USER}:${IDB_USER} ${IDB_PATH}"
                ( cd "${IDB_TMP}" && run_scp_idb "sync instantly-db files" docker-compose.yml "${IDB_USER}@${IDB_HOST}:${IDB_PATH}/" )
                ( cd "${IDB_TMP}" && run_scp_idb "sync instantly-db migrations" -r migrations "${IDB_USER}@${IDB_HOST}:${IDB_PATH}/" )
                ( cd "${IDB_TMP}" && run_scp_idb "sync instantly-db scripts" -r scripts "${IDB_USER}@${IDB_HOST}:${IDB_PATH}/" )
                rm -rf "${IDB_TMP}"
                run_ssh_idb "instantly-db compose up + migrator" "set -e
                cd ${IDB_PATH}
                if [ ! -f .env ]; then echo \"[idb] FATAL: нет .env в ${IDB_PATH} — создай по deploy/instantly-db/.env.example\"; exit 1; fi
                printf '%s\n' \"${DOCKER_PASSWORD}\" | sudo -n docker login -u \"${DOCKER_USERNAME}\" --password-stdin
                export DOCKER_CLIENT_TIMEOUT=300
                export COMPOSE_HTTP_TIMEOUT=300
                sudo -n docker rm -f instantly-migrator 2>/dev/null || true
                # Бэкапы переехали на Portal-сервер (services/backup). Гарантированно
                # сносим старый instantly-backup, чтобы не плодить дубли дампов.
                sudo -n docker rm -f instantly-backup 2>/dev/null || true
                sudo -n docker compose -f docker-compose.yml -p instantly-db --env-file .env pull
                sudo -n docker compose -f docker-compose.yml -p instantly-db --env-file .env up -d --build
                echo '[idb] waiting for instantly-migrator...'
                mrc=\$(sudo -n docker wait instantly-migrator)
                if [ \"\$mrc\" != \"0\" ]; then
                  echo \"[idb] migrator exited with \$mrc\" >&2
                  sudo -n docker logs instantly-migrator 2>&1 | tail -120 || true
                  exit 1
                fi
                echo '[idb] migrator OK'
                "
                IDB_DO_IMPORT=0
                if [ -n "${INSTANTLY_SOURCE_DB_URL:-}" ]; then
                  if [ "${INSTANTLY_FORCE_SUPABASE_IMPORT:-}" = "1" ]; then
                    run_ssh_idb "remove supabase import marker" "rm -f ${IDB_PATH}/.supabase_import_done" || true
                  fi
                  if run_ssh_idb "check supabase import marker" "test ! -f ${IDB_PATH}/.supabase_import_done"; then
                    IDB_DO_IMPORT=1
                  else
                    echo "[scheduled] Instantly DB: одноразовый импорт из Supabase уже выполнен (.supabase_import_done)"
                  fi
                else
                  echo "[scheduled] Instantly DB: INSTANTLY_SOURCE_DB_URL пуст — пропуск одноразового импорта из Supabase"
                fi
                if [ "${IDB_DO_IMPORT}" = 1 ]; then
                  IDB_IMP=$(mktemp)
                  printf 'INSTANTLY_SOURCE_DB_URL=%s\n' "${INSTANTLY_SOURCE_DB_URL}" > "${IDB_IMP}"
                  chmod 600 "${IDB_IMP}"
                  run_scp_idb "sync instantly-ci-import.env" "${IDB_IMP}" "${IDB_USER}@${IDB_HOST}:${IDB_PATH}/.instantly-ci-import.env"
                  rm -f "${IDB_IMP}"
                  run_ssh_idb "supabase → instantly prod (one-time)" "set -e
                  cd ${IDB_PATH}
                  umask 077
                  PW=\$(grep '^INSTANTLY_PROD_PG_PASSWORD=' .env | tail -1 | cut -d= -f2-)
                  printf 'INSTANTLY_DATABASE_URL=postgresql://instantly:%s@127.0.0.1:35432/instantly\n' \"\${PW}\" > .instantly-ci-target.env
                  chmod 600 .instantly-ci-import.env .instantly-ci-target.env 2>/dev/null || true
                  printf '%s\n' \"${DOCKER_PASSWORD}\" | sudo -n docker login -u \"${DOCKER_USERNAME}\" --password-stdin
                  sudo -n docker pull \"${DOCKER_USERNAME}/portal:prod\"
                  sudo -n docker run --rm --network host \\
                    --env-file .instantly-ci-import.env \\
                    --env-file .instantly-ci-target.env \\
                    \"${DOCKER_USERNAME}/portal:prod\" node scripts/migrate-instantly-to-local-pg.mjs
                  rm -f .instantly-ci-import.env .instantly-ci-target.env
                  touch .supabase_import_done
                  echo '[idb] supabase import done; убери INSTANTLY_SOURCE_DB_URL из CI после проверки'
                  "
                fi
              else
                echo "[scheduled] Instantly DB: INSTANTLY_DB_SSH_HOST пуст — деплой БД на отдельном сервере пропущен (только Portal + preflight по .env)"
              fi

              run_scp "copy compose files" \
                docker-compose.prod.yml drain-worker.sh deploy/nginx/50x.html ${USER}@${HOST}:/home/Portal/prod/

              printf '%s\n' "${DOCKER_PASSWORD}" | sshpass -p "${SERVER_PASSWORD}" ssh ${SSH_LONG} ${USER}@${HOST} \
                "set -e;
                cd /home/Portal/prod;
                chmod +x drain-worker.sh;
                upsert_env() {
                  key=\"\$1\";
                  val=\"\$2\";
                  if [ ! -f .env ]; then
                    echo '.env not found in /home/Portal/prod' && exit 1;
                  fi;
                  if grep -q \"^\${key}=\" .env; then
                    sed -i \"s|^\${key}=.*|\${key}=\${val}|\" .env;
                  else
                    printf '\n%s=%s\n' \"\${key}\" \"\${val}\" >> .env;
                  fi;
                };
                read_env() {
                  key=\"\$1\";
                  grep -E \"^\${key}=\" .env | tail -n1 | cut -d= -f2-;
                };
                fix_env_permissions() {
                  if [ ! -f .env ]; then
                    echo '.env not found in /home/Portal/prod' && exit 1;
                  fi;
                  sudo -n chgrp 1001 .env 2>/dev/null || true;
                  sudo -n chmod 664 .env 2>/dev/null || true;
                };
                send_health_alert() {
                  msg=\"\$1\";
                  bot_token=\"\$(read_env TELEGRAM_HEALTH_BOT_TOKEN)\";
                  if [ -z \"\${bot_token}\" ]; then
                    bot_token=\"\$(read_env TELEGRAM_BOT_TOKEN)\";
                  fi;
                  chat_id=\"\$(read_env TELEGRAM_HEALTH_CHAT_ID)\";
                  if [ -z \"\${bot_token}\" ] || [ -z \"\${chat_id}\" ]; then
                    echo '[scheduled] health alert skipped: bot token or chat id is empty';
                    return 0;
                  fi;
                  curl -fsS -X POST \"https://api.telegram.org/bot\${bot_token}/sendMessage\" \
                    --data-urlencode \"chat_id=\${chat_id}\" \
                    --data-urlencode \"text=\${msg}\" >/dev/null || true;
                };
                maintenance_enabled=0;
                disable_maintenance() {
                  if [ \"\${maintenance_enabled}\" != \"1\" ]; then
                    return;
                  fi;
                  echo '--- Step 6: disable maintenance mode (fail-safe) ---';
                  echo '[scheduled] maintenance fail-safe executed';
                  upsert_env MAINTENANCE_MODE false || true;
                  fix_env_permissions || true;
                  SAFE_DOCKER_GID=\$(stat -c '%g' /var/run/docker.sock 2>/dev/null || echo 999);
                  sudo -n docker stop portal 2>/dev/null || true;
                  sudo -n docker rm -f portal portal-portal-1 2>/dev/null || true;
                  wait_port_free 3000 15 2>/dev/null || true;
                  sudo -n env DOCKER_GID=\"\${SAFE_DOCKER_GID}\" docker compose --env-file .env -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate portal || true;
                  maintenance_enabled=0;
                };
                trap 'rc=$?; disable_maintenance; exit $rc' EXIT;
                echo '--- Step 0: ensure deps (skip if already present) ---';
                if ! command -v apt-get >/dev/null 2>&1; then echo 'apt-get not found' && exit 1; fi;
                if ! command -v curl >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
                  sudo -n apt-get update;
                  sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y curl python3 ca-certificates;
                fi;
                if ! command -v docker >/dev/null 2>&1 || ! sudo -n docker compose version >/dev/null 2>&1; then
                  sudo -n curl -fsSL https://get.docker.com -o /tmp/get-docker.sh;
                  sudo -n sh /tmp/get-docker.sh;
                  sudo -n systemctl enable --now docker >/dev/null 2>&1 || true;
                fi;
                export DOCKER_GID=\$(stat -c '%g' /var/run/docker.sock 2>/dev/null || echo 999);
                echo \"Using DOCKER_GID=\${DOCKER_GID}\";
                echo '--- Step 0.1: install custom nginx 50x page ---';
                if [ -f /home/Portal/prod/50x.html ]; then
                  sudo -n cp /home/Portal/prod/50x.html /usr/share/nginx/html/50x.html || true;
                fi;
                echo '--- Step 0.2: ensure .env permissions for portal ---';
                fix_env_permissions;
                echo '--- Step 1: pull new images ---';
                sudo -n docker login -u \"${DOCKER_USERNAME}\" --password-stdin;
                export DOCKER_CLIENT_TIMEOUT=300;
                export COMPOSE_HTTP_TIMEOUT=300;
                NETLABEL=\$(sudo -n docker network inspect portal_portal-network --format '{{index .Labels \"com.docker.compose.network\"}}' 2>/dev/null || true);
                if [ -n \"\${NETLABEL+set}\" ] && [ \"\${NETLABEL}\" != 'portal-network' ]; then
                  echo '[scheduled] removing orphaned portal_portal-network (bad labels)';
                  sudo -n docker network rm portal_portal-network 2>/dev/null || true;
                fi;
                pull_attempt=1;
                pull_max=5;
                while [ \"\${pull_attempt}\" -le \"\${pull_max}\" ]; do
                  echo \"[scheduled] docker compose pull: attempt \${pull_attempt}/\${pull_max}\";
                  if sudo -n env DOCKER_GID=\"\${DOCKER_GID}\" docker compose --env-file .env -p portal -f docker-compose.prod.yml pull; then
                    break;
                  fi;
                  if [ \"\${pull_attempt}\" -eq \"\${pull_max}\" ]; then
                    echo \"[scheduled] docker compose pull failed after \${pull_max} attempts\" >&2;
                    exit 1;
                  fi;
                  sleep_for=$((15 * pull_attempt));
                  echo \"[scheduled] docker compose pull failed; sleeping \${sleep_for}s before retry\" >&2;
                  sleep \"\${sleep_for}\";
                  pull_attempt=$((pull_attempt + 1));
                done;
                echo '--- Step 1.1: preflight migration check on new portal image ---';
                MIGRATION_OUTPUT=\"\$(sudo -n docker run --rm --network host --env-file .env ${DOCKER_USERNAME}/portal:prod node scripts/db/ensureDatabase.js 2>&1)\" || MIGRATION_RC=\$?;
                MIGRATION_RC=\${MIGRATION_RC:-0};
                if [ \"\${MIGRATION_RC}\" -ne 0 ]; then
                  echo \"\${MIGRATION_OUTPUT}\";
                  MIGRATION_TAIL=\"\$(printf '%s' \"\${MIGRATION_OUTPUT}\" | tail -n 20)\";
                  ALERT=\"⚠️ DEPLOY ABORTED: migration precheck failed on new portal build (${COMMIT_SHA}). Old build remains active. Last migration error lines:\n\${MIGRATION_TAIL}\";
                  echo \"\${ALERT}\";
                  send_health_alert \"\${ALERT}\";
                  exit 1;
                fi;
                wait_port_free() {
                  local port=\"\$1\" max_wait=\"\${2:-30}\";
                  local i=0;
                  while [ \"\$i\" -lt \"\$max_wait\" ]; do
                    if ! sudo -n ss -tlnp 2>/dev/null | grep -q \":\${port} \"; then
                      echo \"[scheduled] port \${port} is free\";
                      return 0;
                    fi;
                    echo \"[scheduled] port \${port} still in use, waiting... (\$((i+1))/\${max_wait})\";
                    sleep 2;
                    i=\$((i + 1));
                  done;
                  echo \"[scheduled] port \${port} still occupied after \${max_wait} checks, killing holder\" >&2;
                  sudo -n fuser -k \"\${port}/tcp\" 2>/dev/null || true;
                  sleep 2;
                };
                echo '--- Step 2: enable maintenance mode ---';
                upsert_env MAINTENANCE_MODE true;
                fix_env_permissions;
                sudo -n docker stop portal 2>/dev/null || true;
                sudo -n docker rm -f portal portal-portal-1 2>/dev/null || true;
                wait_port_free 3000 15;
                sudo -n env DOCKER_GID=\"\${DOCKER_GID}\" docker compose --env-file .env -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate portal;
                maintenance_enabled=1;
                echo '--- Step 3: drain worker ---';
                sudo -n bash drain-worker.sh;
                force_rm_svc() {
                  local svc=\"\$1\";
                  local cids=\$(sudo -n docker ps -a --filter \"label=com.docker.compose.service=\$svc\" -q);
                  if [ -z \"\${cids}\" ]; then return 0; fi;
                  if echo \"\${cids}\" | xargs -r sudo -n docker rm -f 2>/dev/null; then return 0; fi;
                  echo \"[deploy] docker rm -f failed for \${svc}, trying SIGKILL...\" >&2;
                  echo \"\${cids}\" | xargs -r sudo -n docker kill --signal=SIGKILL 2>/dev/null || true;
                  sleep 3;
                  echo \"\${cids}\" | xargs -r sudo -n docker rm -f 2>/dev/null || true;
                };
                echo '--- Step 4: restart portal + yandexmaps + transcribe-worker + guacd + rdp-ws + telegram-bot-api + health-check + atmos-bot + instantly-sync-bot + portal-backup + changelog-bot ---';
                for svc in portal yandexmaps transcribe-worker guacd rdp-ws telegram-bot-api health-check atmos-bot instantly-sync-bot portal-backup changelog-bot; do force_rm_svc \"\$svc\"; done;
                sudo -n docker rm -f portal portal-portal-1 portal-guacd portal-yandexmaps portal-transcribe-worker portal-rdp-ws portal-telegram-bot-api portal-health-check portal-atmos-bot portal-instantly-sync-bot portal-backup portal-changelog-bot 2>/dev/null || true;
                wait_port_free 3000 15;
                sudo -n env DOCKER_GID="\${DOCKER_GID}" docker compose --env-file .env -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate portal yandexmaps transcribe-worker guacd rdp-ws telegram-bot-api health-check atmos-bot instantly-sync-bot portal-backup changelog-bot;
                echo '--- Step 4.1: verify Docker socket access inside portal ---';
                PORTAL_GROUPS=\$(sudo -n docker inspect portal --format '{{json .HostConfig.GroupAdd}}' 2>/dev/null || echo '[]');
                echo \"portal GroupAdd=\${PORTAL_GROUPS}\";
                case \"\${PORTAL_GROUPS}\" in
                  *\"\\\"\${DOCKER_GID}\\\"\"*) echo 'portal has expected DOCKER_GID in GroupAdd';;
                  *) echo 'portal is missing expected DOCKER_GID in GroupAdd' && exit 1;;
                esac;
                sudo -n docker exec portal sh -lc 'id; ls -ln /var/run/docker.sock; test -S /var/run/docker.sock && test -r /var/run/docker.sock && test -w /var/run/docker.sock';
                echo '--- Step 5: restart workers ---';
                for svc in worker-hh worker-search worker-enrich worker-yandexmaps worker-emailvalidation worker-tg-outreach worker-aicaller worker-sales-copilot worker-tg-parser worker-tg-transcribe worker-instantly-leads worker-outreach worker-li-outreach; do force_rm_svc \"\$svc\"; done;
                sudo -n docker rm -f portal-worker-hh portal-worker-search portal-worker-enrich portal-worker-yandexmaps portal-worker-emailvalidation portal-worker-tg-outreach portal-worker-aicaller portal-worker-sales-copilot portal-worker-tg-parser portal-worker-tg-transcribe portal-worker-instantly-leads portal-worker-outreach portal-worker-li-outreach 2>/dev/null || true;
                sudo -n env DOCKER_GID="\${DOCKER_GID}" docker compose --env-file .env -p portal -f docker-compose.prod.yml up -d --no-deps --force-recreate worker-hh worker-search worker-enrich worker-yandexmaps worker-emailvalidation worker-tg-outreach worker-aicaller worker-sales-copilot worker-tg-parser worker-tg-transcribe worker-instantly-leads worker-outreach worker-li-outreach;
                echo '--- Step 6: disable maintenance mode (normal path) ---';
                echo '[scheduled] maintenance disabled after successful deploy';
                disable_maintenance;
                sudo -n docker image prune -f;
                sudo -n docker volume prune -f;
                echo '--- Deploy complete ---'"

              echo "--- Waiting 15s for container to stabilize ---"
              sleep 15

              echo "--- Docker container status ---"
              run_ssh "docker ps" \
                "sudo -n docker ps -a --filter name=portal --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'" || true

              echo "--- Portal container logs (last 200 lines) ---"
              run_ssh "docker logs" \
                "sudo -n docker logs portal --tail 200 2>&1" || true

              run_ssh "write last_deploy_sha" \
                "echo $COMMIT_SHA > /home/Portal/prod/last_deploy_sha"
